<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Agent Animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f13;--card:#151820;--line:#232835;--text:#eef1f6;--dim:#8a93a3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,sans-serif}
body{background:radial-gradient(1200px 500px at 50% -200px,#1d2333 0%,var(--bg) 70%) no-repeat,var(--bg)}
main{max-width:1120px;margin:0 auto;padding:64px 16px 80px}
h1{font:700 40px/1 "Cinzel",serif;letter-spacing:.02em;margin:0 0 14px}
.made{display:inline-flex;align-items:center;gap:8px;margin:0 0 40px;font:500 13px/1 Inter,sans-serif;color:var(--dim);text-decoration:none;padding:7px 12px 7px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.02);transition:color .2s,border-color .2s}
.made:hover{color:var(--text);border-color:#3a4256}
.made b{color:var(--text);font-weight:600}
.made svg{width:15px;height:15px}
header{display:flex;flex-direction:column;align-items:flex-start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{position:relative;display:block;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;
  transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);border-color:#3a4256;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card .img{aspect-ratio:16/10;background:#0a0c10 center/cover no-repeat;transition:transform .5s}
.card:hover .img{transform:scale(1.04)}
.card .info{display:flex;align-items:center;gap:10px;padding:14px 16px}
.card h2{font:700 18px/1.2 "Cinzel",serif;margin:0;flex:1}
.tag{font:600 11px/1 Inter,sans-serif;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap}
</style>
</head>
<body>
<main>
  <header>
    <h1>Coding Agent Animations</h1>
    <a class="made" href="https://threejs.org" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 21 21 18 9 3Z"/><path d="M6 12l9 4.5M15 10.5 6 12M12 19.5 15 10.5"/></svg>Built with <b>three.js</b></a>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script>
/* Add a collection: a folder with index.html + README.md + cover.jpg, then an entry here. */
const COLLECTIONS=[
  {href:'wow/index.html',title:'WoW Forever Classes',style:'voxel',cover:'wow/cover.jpg'},
  {href:'wow-cities/index.html',title:'WoW Forever Cities',style:'tilt-shift',cover:'wow-cities/cover.jpg'},
];
document.getElementById('grid').innerHTML=COLLECTIONS.map(c=>
  `<a class="card" href="${c.href}"><div class="img" style="background-image:url('${c.cover}')"></div>`+
  `<div class="info"><h2>${c.title}</h2><span class="tag">${c.style}</span></div></a>`).join('');
</script>
</body>
</html>
