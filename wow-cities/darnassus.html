<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darnassus</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a3266}
canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const CFG={title:'Darnassus',R:36,cam:[34,54,58],fog:[100,280],cycle:0,t0:.2,az:.6,bloom:.6,
  light:{day:{sky:'#2a3266',sun:'#c8c0ff',si:1.5,hs:'#9aa8ff',hg:'#2a4a3a',hi:1.25,exp:1.15,lamp:1,el:1}}};

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>1-(1-t)*(1-t);
const sstep=t=>(t=clamp(t),t*t*(3-2*t));
const damp=(c,t,k,dt)=>c+(t-c)*Math.min(1,k*dt);
const lerpAng=(a,b,t)=>{const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=(i,k=0)=>{const s=Math.sin(i*12.9898+k*78.233)*43758.5453;return s-Math.floor(s);};
const hsl=(h,s,l)=>new THREE.Color().setHSL(h,s,clamp(l));

/* ---------- renderer, camera, light */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color();scene.fog=new THREE.Fog(0,CFG.fog[0],CFG.fog[1]);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,1,900);
const CAM0=CFG.cam||[0,56,70];camera.position.set(CAM0[0],CAM0[1],CAM0[2]);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;controls.minPolarAngle=.35;controls.maxPolarAngle=1.18;controls.minDistance=22;controls.maxDistance=170;
controls.target.set(0,CFG.ty??3,0);controls.autoRotate=true;controls.autoRotateSpeed=.22;
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-.0004;sun.shadow.normalBias=.04;
Object.assign(sun.shadow.camera,{left:-46,right:46,top:46,bottom:-46,near:1,far:260});sun.shadow.camera.updateProjectionMatrix();
scene.add(sun,sun.target);

/* ---------- post: bloom, grade, tilt-shift (blur grows away from a horizontal focus band) */
const VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const TILT={uniforms:{tDiffuse:{value:null},dir:{value:new THREE.Vector2()},focus:{value:.47},band:{value:.09},amt:{value:2}},vertexShader:VS,
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 dir;uniform float focus,band,amt;varying vec2 vUv;
  void main(){float d=vUv.y-focus;float b=(d>0.?smoothstep(band+.06,band+.5,d)*.55:smoothstep(band,band+.3,-d))*amt;vec4 s=vec4(0.);float w=0.;
  for(int i=-6;i<=6;i++){float f=float(i),g=exp(-f*f/16.);s+=texture2D(tDiffuse,vUv+dir*f*b)*g;w+=g;}gl_FragColor=s/w;}`};
const GRADE={uniforms:{tDiffuse:{value:null},sat:{value:CFG.sat??1.25},con:{value:1.07},vig:{value:1.15}},vertexShader:VS,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float sat,con,vig;varying vec2 vUv;
  void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(.299,.587,.114));vec3 o=mix(vec3(l),c.rgb,sat);o=(o-.5)*con+.5;
  vec2 q=vUv-.5;o*=1.-dot(q,q)*vig;gl_FragColor=vec4(clamp(o,0.,1.),c.a);}`};
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio,2));
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),CFG.bloom??.5,.5,.86));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass(GRADE));
const tilts=[];for(let k=0;k<2;k++)for(const d of[[1,0],[0,1]]){const p=new ShaderPass(TILT);p.d=d;p.uniforms.amt.value=k?1.5:2.3;composer.addPass(p);tilts.push(p);}
const sizeTilt=()=>{for(const p of tilts)p.uniforms.dir.value.set(p.d[0]/innerWidth,p.d[1]/innerHeight);};sizeTilt();

/* ---------- materials + voxel helpers */
const box=new THREE.BoxGeometry(1,1,1);
const ML={};const lam=c=>ML[c]||(ML[c]=new THREE.MeshLambertMaterial({color:c}));
const MBc={};const bas=c=>MBc[c]||(MBc[c]=new THREE.MeshBasicMaterial({color:c}));
const MG={};const glow=c=>MG[c]||(MG[c]=new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(3)}));
const addMat=(c,o=1,side=THREE.FrontSide)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side});
const winMat=new THREE.MeshBasicMaterial({color:0xffffff});   // lit windows + lamps: dark by day, glowing at night
function B(p,sx,sy,sz,c,x,y,z,mat){const o=new THREE.Mesh(box,mat?mat(c):lam(c));o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;}
function G(p,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g;}
function ms(){const c={},list=[];const f=k=>c[k]||(list.push(c[k]=new THREE.MeshLambertMaterial({color:k})),c[k]);f.list=list;return f;}
const TICK=[],VIS=[];   // per-city hooks: TICK(dt) at 60 Hz, VIS(dt,t) per frame

/* ---------- particles */
const parts=[];
function part(pos,vel,color,size,life,grav=0,mode='b'){
  const o=new THREE.Mesh(box,mode==='g'?glow(color):mode==='s'?lam(color):bas(color));o.position.copy(pos);
  const s=size.isVector3?size.clone():V(size,size,size);o.scale.copy(s);scene.add(o);parts.push({o,vel,life,max:life,s,grav});}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
  if(p.life<=0){scene.remove(p.o);parts.splice(i,1);continue;}
  p.vel.y+=p.grav*dt;p.o.position.addScaledVector(p.vel,dt);p.o.scale.copy(p.s).multiplyScalar(p.life/p.max);}}
const later=[];const after=(t,fn)=>later.push({t,fn});
function runLater(dt){for(let i=later.length-1;i>=0;i--){later[i].t-=dt;if(later[i].t<=0){const f=later[i].fn;later.splice(i,1);f();}}}
/* instanced field: fn(i,seed,t,outPos,dt) sets outPos and returns the cube size */
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_s=V(),_p=V(),_c=new THREE.Color();
function field(n,mat,fn,shadow=false){const im=new THREE.InstancedMesh(box,mat,n);im.frustumCulled=false;im.castShadow=shadow;scene.add(im);
  const seed=Float32Array.from({length:n},()=>Math.random()),o=V();
  VIS.push((dt,t)=>{for(let i=0;i<n;i++){const s=fn(i,seed[i],t,o,dt);_m.makeScale(s,s,s).setPosition(o);im.setMatrixAt(i,_m);}im.instanceMatrix.needsUpdate=true;});return im;}

/* ---------- island terrain: one InstancedMesh of 1x1 columns. fn(x,z,r) -> [height, color, depth?] or null */
const R=CFG.R??34,GY=1;
const HM=new Map(),key=(x,z)=>x+','+z;
function terrain(fn){const cols=[];
  for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){const r=Math.hypot(x,z);if(r>R)continue;const o=fn(x,z,r);if(!o)continue;HM.set(key(x,z),o[0]);cols.push([x,z,o[0],o[1],o[2]??2.2]);}
  const mesh=new THREE.InstancedMesh(box,new THREE.MeshLambertMaterial(),cols.length),m=new THREE.Matrix4();
  cols.forEach(([x,z,h,c,dp],i)=>{const hg=Math.max(2,dp+h);m.makeScale(1,hg,1).setPosition(x,GY+h-hg/2,z);mesh.setMatrixAt(i,m);mesh.setColorAt(i,c);});
  mesh.receiveShadow=mesh.castShadow=true;scene.add(mesh);return mesh;}
const groundAt=(x,z)=>GY+(HM.get(key(Math.round(x),Math.round(z)))??0);

/* sea with waves + foam ring */
let water=null,wposA,wbase;
function sea(c,y=.35,foamC='#ffffff',hole=0){const g=hole?new THREE.RingGeometry(hole,190,120,40):new THREE.PlaneGeometry(340,340,100,100);g.rotateX(-Math.PI/2);
  water=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c,flatShading:true}));water.position.y=y;water.receiveShadow=true;scene.add(water);
  wposA=g.attributes.position;wbase=Float32Array.from(wposA.array);
  const foam=new THREE.Mesh(new THREE.RingGeometry(R-.4,R+1.2,72).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:foamC,transparent:true,opacity:.45}));foam.position.y=y+.16;scene.add(foam);}
function waves(t){if(!water)return;const a=wposA.array;for(let i=0;i<wposA.count;i++){const x=wbase[i*3],z=wbase[i*3+2];a[i*3+1]=Math.sin(x*.3+t*.8)*.1+Math.cos(z*.28+t*.6)*.1;}wposA.needsUpdate=true;}

/* ---------- static props: baked into one InstancedMesh (+ one for lit windows) */
const PROPS=[],WINS=[],SMOKE=[];
const prop=(x,y,z,sx,sy,sz,c,ry=0)=>PROPS.push([x,y,z,sx,sy,sz,c,ry]);
const win=(x,y,z,sx,sy,sz,c='#ffb050',ry=0)=>WINS.push([x,y,z,sx,sy,sz,c,ry]);
function inst(list,mat,shadow){const mesh=new THREE.InstancedMesh(box,mat,list.length);
  list.forEach(([x,y,z,sx,sy,sz,c,ry],i)=>{_q.setFromEuler(_e.set(0,ry,0));_m.compose(_p.set(x,y,z),_q,_s.set(sx,sy,sz));mesh.setMatrixAt(i,_m);mesh.setColorAt(i,_c.set(c));});
  mesh.castShadow=mesh.receiveShadow=shadow;scene.add(mesh);return mesh;}
/* local frame: build a structure in its own coordinates, rotated by ry about (cx,cz) */
function local(cx,cy,cz,ry=0){const c=Math.cos(ry),s=Math.sin(ry),T=(x,z)=>[cx+x*c+z*s,cz-x*s+z*c];
  return{p(x,y,z,sx,sy,sz,col,r=0){const[X,Z]=T(x,z);prop(X,cy+y,Z,sx,sy,sz,col,ry+r);},
    w(x,y,z,sx,sy,sz,col,r=0){const[X,Z]=T(x,z);win(X,cy+y,Z,sx,sy,sz,col,ry+r);},
    at(x,y,z){const[X,Z]=T(x,z);return V(X,cy+y,Z);},ry};}
/* straight wall from (x1,z1) to (x2,z2), optional crenellations */
function seg(x1,z1,x2,z2,y,h,th,c,cren){const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz),ry=Math.atan2(dx,dz);
  prop((x1+x2)/2,y+h/2,(z1+z2)/2,th,h,L,c,ry);
  if(cren){const n=Math.max(1,Math.floor(L/1.1));for(let i=0;i<n;i++){const k=(i+.5)/n;prop(x1+dx*k,y+h+.28,z1+dz*k,th+.08,.56,.55,cren,ry);}}}
/* stepped roofs */
function gable(L,x,y,z,w,d,c,n=4,ov=.35,hk=.9){const W=w+ov*2,hs=W/2/n*hk;for(let i=0;i<n;i++)L.p(x,y+hs*(i+.5),z,W*(1-i/n),hs,d+ov*2,c);return y+hs*n;}
function pyramid(L,x,y,z,w,c,n=5,hk=.8){const W=w+.4,hs=W*hk/n;for(let i=0;i<n;i++){const ww=W*(1-i/(n+.4));L.p(x,y+hs*(i+.5),z,ww,hs,ww,c);}return y+hs*n;}
/* half-timbered house; door faces local +z, ridge runs along z */
function house(cx,cz,ry,o){const y=o.y??groundAt(cx,cz),L=local(cx,y,cz,ry),{w,d,h}=o,g=o.glass||'#ffb050';
  L.p(0,h/2,0,w,h,d,o.wall);L.p(0,.15,0,w+.14,.3,d+.14,o.base||'#8e8a80');
  if(o.timber){for(const sx of[-1,1])for(const sz of[-1,1])L.p(sx*w/2,h/2,sz*d/2,.16,h,.16,o.timber);
    for(const sz of[-1,1])L.p(0,h*.52,sz*(d/2+.02),w,.12,.06,o.timber);for(const sx of[-1,1])L.p(sx*(w/2+.02),h*.52,0,.06,.12,d,o.timber);
    L.p(0,h-.06,d/2+.03,w,.12,.06,o.timber);}
  const nw=Math.max(1,Math.round(w/1.35));
  for(let i=0;i<nw;i++){const x=(i+.5)/nw*w-w/2;for(const s of[-1,1]){if(h>2.2)L.w(x,h*.74,s*(d/2+.04),.34,.44,.05,g);
    if(s<0||Math.abs(x)>.6)L.w(x,h*.3,s*(d/2+.04),.34,.4,.05,g);}}
  const nd=Math.max(1,Math.round(d/1.6));for(let i=0;i<nd;i++){const z=(i+.5)/nd*d-d/2;for(const s of[-1,1])L.w(s*(w/2+.04),h*.72,z,.05,.42,.34,g);}
  L.p(0,.55,d/2+.04,.62,1.1,.06,o.door||'#4a2e1a');
  const top=gable(L,0,h,0,w,d,o.roof,o.steps||4,.35,o.pitch||.9);
  if(o.chim){const x=w*.26*(o.chim>0?1:-1);L.p(x,(h+top)/2+.4,-d*.22,.42,top-h+.8,.42,o.chimC||'#7a6e62');SMOKE.push(L.at(x,top+1,-d*.22));}
  return top;}
function lampPost(x,z,c='#ffc070',h=2.2,y=groundAt(x,z),pc='#2a2a30'){prop(x,y+h/2,z,.12,h,.12,pc);prop(x,y+h,z,.34,.08,.34,pc);win(x,y+h+.22,z,.24,.32,.24,c);prop(x,y+h+.44,z,.36,.1,.36,pc);}
function oak(x,z,s=1,leaf='#4f8a32',trunk='#5a3d22',y=groundAt(x,z)){prop(x,y+1*s,z,.4*s,2*s,.4*s,trunk);
  for(let k=0;k<5;k++){const a=k/5*TAU+rand(0,1),rr=k?.7*s:0,sz=(k?1.3:1.8)*s*rand(.9,1.1);prop(x+Math.cos(a)*rr,y+(2.4+(k?rand(-.3,.3):.5))*s,z+Math.sin(a)*rr,sz,sz*.8,sz,hsl(...leafHSL(leaf,rand(-.04,.04))));}}
const leafHSL=(c,dl)=>{const o={};new THREE.Color(c).getHSL(o);return[o.h,o.s,o.l+dl];};
function pine(x,z,s=1,leaf='#2f5a34',y=groundAt(x,z)){prop(x,y+.6*s,z,.35*s,1.2*s,.35*s,'#4a3220');
  for(let k=0;k<4;k++){const w=(1.9-k*.42)*s;prop(x,y+(1.3+k*.75)*s,z,w,.75*s,w,hsl(...leafHSL(leaf,k*.025)));}}
/* smoke puffs rising from every SMOKE source (chimneys, fires) */
function smokeField(c='#e4e4e4'){if(!SMOKE.length)return;const per=5;
  field(SMOKE.length*per,new THREE.MeshLambertMaterial({color:c,transparent:true,opacity:.55,depthWrite:false}),(i,sd,t,o)=>{const s=SMOKE[Math.floor(i/per)],a=((t*.16+(i%per)/per+sd*.15)%1);
    o.set(s.x+a*2.2+Math.sin(t+i)*.2,s.y+a*4.2,s.z+a*.8);return Math.pow(Math.sin(a*Math.PI),.7)*(.14+a*.38);});}
function bake(){if(PROPS.length)inst(PROPS,new THREE.MeshLambertMaterial(),true);if(WINS.length)inst(WINS,winMat,false);smokeField(CFG.smoke);}

/* flags, fires, clouds, birds, lamps */
const FLAGS=[];function flag(x,y,z,w,h,c,ry=0,c2){const g=G(scene,x,y,z);g.rotation.y=ry;const f=G(g);B(f,.05,h,w*.55,c,0,-h/2,w*.28);const f2=G(f,0,0,w*.55);B(f2,.05,h*.92,w*.45,c2||c,0,-h*.46,w*.23);
  FLAGS.push({g,f,f2,ry,sd:Math.random()*9});return g;}
const FIRES=[];function fire(x,y,z,s=1,light=0,c1='#ff7a1a',c2='#ffc23f'){const g=G(scene,x,y,z);const f1=B(g,.5*s,.5*s,.5*s,c1,0,.25*s,0,glow),f2=B(g,.3*s,.4*s,.3*s,c2,0,.55*s,0,glow);
  f1.castShadow=f2.castShadow=false;let l=null;if(light){l=new THREE.PointLight(c1,light,9*s+4,1.6);l.position.set(0,1,0);g.add(l);}FIRES.push({g,f1,f2,l,s,base:light,c:[c1,c2]});return g;}
const LAMPS=[];function lampLight(x,y,z,c,i,d=10){const l=new THREE.PointLight(c,0,d,1.6);l.position.set(x,y,z);scene.add(l);LAMPS.push({l,i});return l;}
const CLOUDS=[];function clouds(n,c='#ffffff',y=30){for(let i=0;i<n;i++){const g=G(scene,rand(-110,110),y+rand(-3,4),rand(-80,30));
  for(let k=0,m=ri(5,9);k<m;k++){const b=B(g,rand(2.4,5),rand(1,1.7),rand(2,3.8),c,rand(-4.5,4.5),rand(-.4,.6),rand(-2,2));b.castShadow=false;}CLOUDS.push({g,v:rand(.5,1.1)});}}
const BIRDS=[];function birds(n,c,cx,cz,r,y,sp=.35){for(let i=0;i<n;i++){const g=G(scene);B(g,.12,.1,.34,c,0,0,0).castShadow=false;
  const wl=G(g,.05,0,0),wr=G(g,-.05,0,0);B(wl,.42,.03,.16,c,.21,0,0).castShadow=false;B(wr,.42,.03,.16,c,-.21,0,0).castShadow=false;
  BIRDS.push({g,wl,wr,cx:cx+rand(-3,3),cz:cz+rand(-3,3),r:r*rand(.7,1.2),y:y+rand(-2,2),a:rand(0,TAU),sp:sp*rand(.8,1.2)*(Math.random()<.5?1:-1),sd:rand(0,9)});}}

/* ---------- characters: one humanoid builder, races vary proportions + features */
const RACE={
  human:{leg:.5,tw:.46,th:.5,hs:.32,sc:1,skin:'#e8b894'},
  dwarf:{leg:.3,tw:.58,th:.48,hs:.34,sc:.96,skin:'#e6ac8a'},
  gnome:{leg:.24,tw:.34,th:.3,hs:.38,sc:.78,skin:'#f0c6aa'},
  nelf:{leg:.62,tw:.44,th:.54,hs:.3,sc:1.08,skin:'#9a86c8'},
  orc:{leg:.48,tw:.62,th:.54,hs:.34,sc:1.06,skin:'#5f9a44'},
  troll:{leg:.64,tw:.44,th:.5,hs:.3,sc:1.1,skin:'#5aa0a8'},
  tauren:{leg:.56,tw:.72,th:.62,hs:.42,sc:1.26,skin:'#7a5a3e'},
  undead:{leg:.5,tw:.4,th:.46,hs:.3,sc:.98,skin:'#a0ac94'},
};
function humanoid(o={}){
  const race=o.race||'human',R=RACE[race],mt=ms(),root=new THREE.Group(),body=G(root);
  const skin=o.skin||R.skin,top=o.top||'#6a4a8a',bot=o.bot||'#4a3a2a',boot=o.boot||'#3a2a1a',hair=o.hair||'#3a2a1a',sl=o.sleeve||top;
  const lg=R.leg,tw=R.tw,th=R.th,hs=R.hs;
  const legs=[G(body,tw*.25,lg,0),G(body,-tw*.25,lg,0)];
  for(const l of legs){B(l,tw*.36,lg*.8,.2,bot,0,-lg*.4,0,mt);B(l,tw*.4,Math.max(.1,lg*.22),.25,race==='tauren'?'#2a2018':boot,0,-lg*.89,.02,mt);}
  const torso=G(body,0,lg,0);
  B(torso,tw,th,tw*.62,top,0,th/2,0,mt);B(torso,tw*1.05,.08,tw*.66,o.belt||'#2a1a10',0,.05,0,mt);
  if(o.robe)B(torso,tw*1.02,lg*.78,tw*.64,o.robe,0,-lg*.36,0,mt);
  if(o.tabard){B(torso,tw*.56,th*.85+.18,.03,o.tabard,0,th*.42-.09,tw*.31+.015,mt);if(o.emblem)B(torso,tw*.22,tw*.22,.03,o.emblem,0,th*.55,tw*.31+.03,mt);}
  if(o.pads)for(const s of[1,-1])B(torso,.2,.13,.26,o.pads,s*(tw/2+.06),th+.02,0,mt);
  const head=G(torso,0,th+hs*.5+.02,0);
  B(head,hs,hs,hs*.92,skin,0,0,0,mt);

{const far=new THREE.Mesh(new THREE.PlaneGeometry(900,900).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:'#24407a'}));far.position.y=GY-86;scene.add(far);}
field(260,new THREE.MeshLambertMaterial({color:'#e4e0ff',transparent:true,opacity:.8,depthWrite:false}),(i,sd,t,o)=>{const c=Math.floor(i/6),a=hash(c)*TAU+t*.006,r=36+hash(c,1)*70;
  o.set(Math.cos(a)*r+(hash(i,4)-.5)*7,GY-20+hash(c,2)*6+(hash(i,5)-.5)*1.6,Math.sin(a)*r+(hash(i,6)-.5)*5);return 2.4+hash(i,7)*2.6;});
/* moon, wisps, fireflies, falling violet leaves */
const moon=B(scene,9,9,1,'#e8ecff',40,60,-140,glow);moon.castShadow=false;
field(30,glow('#9ad8ff'),(i,sd,t,o)=>{const a=hash(i)*TAU+t*.08*(hash(i,3)-.5),r=6+hash(i,1)*20;o.set(Math.cos(a)*r+Math.sin(t*.6+i)*.8,GY+1.5+hash(i,2)*3+Math.sin(t*.9+i*2)*.6,Math.sin(a)*r);return .22+Math.sin(t*3+i)*.05;});
field(110,glow('#7a8a2a'),(i,sd,t,o)=>{const a=hash(i)*TAU,r=8+hash(i,1)*20;o.set(Math.cos(a)*r+Math.sin(t*.7+i)*.6,GY+.4+hash(i,2)*2.2+Math.sin(t*1.3+i)*.3,Math.sin(a)*r+Math.cos(t*.5+i)*.6);return (Math.sin(t*2.2+i*1.7)>.3)?.07:.0;});
field(160,lam('#9a6ad8'),(i,sd,t,o)=>{const k=(t*.035+sd)%1,a=hash(i)*TAU,r=hash(i,1)*30;o.set(Math.cos(a)*r+Math.sin(t*.8+i)*1.2,GY+18-k*18,Math.sin(a)*r+Math.cos(t*.6+i)*1.2);return .13;});
birds(5,'#2a2440',0,0,22,14,.25);
const cE=causeway(-2,0,9.6,0,GY+.3,GY,1.2),cS=causeway(-6,4,-6,11.4,GY+.3,GY,.9),cW=causeway(-10,0,-21.6,0,GY+.3,GY,1.2);
bake();

/* ---------- nav: the shore loop through every terrace, the three causeways, the island ring, temple, enclave, portal, gate */
const main=loop(MAIN.map(([x,z])=>N(x,z)));const M=i=>main[i];
const isl=loop(Array.from({length:8},(_,k)=>{const a=k/8*TAU;return N(ISLE.x+Math.cos(a)*3.5,ISLE.z+Math.sin(a)*3.5,GY+.3);}));
const bank=N(ISLE.x,ISLE.z+.7,GY+.3,{stop:[3,7],look:Math.PI});link(isl[2],bank);
link(isl[0],cE[0]);link(cE[4],M(6));link(isl[2],cS[0]);link(cS[4],M(10));link(isl[4],cW[0]);link(cW[4],M(0));
const tDoor=N(TM.x,TM.z-5.6,GY+.3),tIn=N(TM.x,TM.z-2.6,GY+.4,{stop:[4,9],look:0});link(M(10),tDoor,tIn);
const portalN=N(PORT.x+2,PORT.z,GY,{stop:[3,7],look:-Math.PI/2});link(M(0),portalN);
const enc=loop(Array.from({length:6},(_,k)=>{const a=k/6*TAU+Math.PI/2;return N(EN.x+Math.cos(a)*2.9,EN.z+Math.sin(a)*2.9);}));link(M(1),N(-13,-15.6),enc[0]);
link(M(4),crafts[2]);link(M(8),trades[6]);
const gate=[N(19,0),N(26.5,0),N(30,0,GY,{stop:[3,8],look:Math.PI/2})];link(M(6),...gate);

/* ---------- people: night elves (druids, priestesses), sentinels on nightsabers, a few visitors */
const NE=['#3a6a5a','#5a3a7a','#2a4a6a','#6a5a8a','#3a5a3a','#8a7aa8'];
function elf(){const r=Math.random(),race=r<.85?'nelf':pick(['dwarf','gnome','human']);
  return humanoid({race,top:pick(NE),bot:pick(['#2a2a3a','#3a2a4a','#2a3a3a']),hair:race==='nelf'?pick(['#3a6a8a','#d8e0f0','#2f7a5a','#6a3a8a','#1a2a4a']):pick(['#3a2a1a','#c8a050','#ff7ab0']),
    skin:race==='nelf'?pick(['#9a86c8','#8a7ac0','#b09ad8','#7a6ab0']):undefined,robe:Math.random()<.45?pick(['#e8e4f4','#6a5a9a','#3a6a5a']):undefined,long:Math.random()<.7,hood:Math.random()<.12?'#3a4a3a':undefined});}
const sentinel=()=>humanoid({race:'nelf',top:'#6a5a8a',sleeve:'#4a3a6a',bot:'#4a3a6a',boot:'#2a2040',helm:'#c8c0e0',crest:'#9a8ac0',pads:'#c8c0e0',spear:true,hair:'#3a6a8a',skin:'#8a7ac0',long:true});
const priestess=()=>humanoid({race:'nelf',top:'#e8e4f4',robe:'#e8e4f4',bot:'#d8d4ec',hair:pick(['#d8e0f0','#3a6a8a']),skin:'#9a86c8',long:true});
const all=NODES.map((_,i)=>i).filter(i=>NODES[i].n.length);
for(let i=0;i<32;i++)walker(elf(),pick(all),{talk:Math.random()<.35});
for(let i=0;i<3;i++)walker(priestess(),pick([tIn,cS[2],isl[3],M(10)]),{speed:1});
for(let i=0;i<2;i++)walker(sentinel(),main[i*6],{route:[...main],ri:i*6,speed:1.2,lane:-.4});
for(const s of[1,-1])walker(sentinel(),N(25.4,s*1.7),{stand:true,face:Math.PI/2});
for(const s of[1,-1])walker(priestess(),N(TM.x+s*1.6,TM.z-6.2,GY),{stand:true,face:Math.PI});
const saber=()=>mounted(quad({kind:'saber',L:1.8,H:.7,W:.5,c:pick(['#3a2a4a','#e8e4f0','#4a3a6a']),stripes:pick(['#1a1428','#8a7aa8']),saddle:'#6a5a8a',eye:'#9ad8ff'}),sentinel());
for(let i=0;i<4;i++)walker(saber(),main[i*3],{route:i<2?[...main].reverse():null,ri:i*3,speed:2.4,lane:.4,pause:.15});
/* deer grazing in the enclave */
for(let i=0;i<3;i++){const d=quad({kind:'horse',L:1.2,H:.75,W:.36,c:'#a87a5a',mane:'#a87a5a',tailC:'#e8e0d0'});walker({root:d.root,mount:d,rider:{head:G(d.body)}},pick(enc),{speed:.9,pause:.6,idle:[3,9]});}

/* ---------- hippogryphs */
const hip=()=>flyerModel({kind:'hippo',c:'#7a8ac8',c2:'#e8e4f8',wc:'#4a8aa8',wc2:'#3a6a9a',rider:elf()});
const ringPts=(r,y,n=8,ph=0,amp=3)=>Array.from({length:n},(_,i)=>{const a=i/n*TAU+ph;return V(Math.cos(a)*r*(1+.15*Math.sin(i*1.7)),y+Math.sin(i*2.1+ph)*amp,Math.sin(a)*r);});
flight(hip(),ringPts(18,20,8,2),{speed:7.5,roost:ROOST,first:1,lift:2});
flight(hip(),ringPts(32,26,9,.6,4),{speed:9});
flight(hip(),[V(-38,22,18),V(-8,28,38),V(32,22,26),V(38,26,-18),V(4,22,-38),V(-32,28,-22)],{speed:8.5});

/* ---------- tick (fixed 60 Hz) + animate (per frame) */
let clock=0;const T0=CFG.t0??.15;
function tick(dt){clock+=dt;runLater(dt);for(const w of PEOPLE)walkTick(w,dt);for(const f of FLY)flyTick(f,dt);for(const L of LIFTS)liftTick(L,dt);for(const f of TICK)f(dt);}
function animate(dt,t){applyLight(CFG.cycle?(T0+t/CFG.cycle)%1:T0);
  for(const w of PEOPLE)animWalker(w,dt,t);for(const f of FLY)animFly(f,dt,t);for(const f of VIS)f(dt,t);waves(t);
  for(const f of FLAGS){f.g.rotation.y=f.ry+Math.sin(t*2.2+f.sd)*.2;f.f2.rotation.y=Math.sin(t*3.1+f.sd)*.35;}
  for(const f of FIRES){const k=1+Math.sin(t*11+f.g.position.x)*.12+Math.sin(t*17+f.g.position.z)*.06;f.f1.scale.set(.5*f.s*k,.5*f.s*k*1.1,.5*f.s*k);f.f2.scale.y=.4*f.s*(2-k);
    if(f.l)f.l.intensity=f.base*k;if(Math.random()<dt*5)part(V(f.g.position.x+rand(-.2,.2)*f.s,f.g.position.y+.8*f.s,f.g.position.z+rand(-.2,.2)*f.s),V(rand(-.3,.3),2,rand(-.3,.3)),pick(f.c),.08,.6,0,'g');}
  for(const c of CLOUDS){c.g.position.x+=c.v*dt;if(c.g.position.x>130)c.g.position.x=-130;}
  for(const b of BIRDS){b.a+=b.sp*dt;b.g.position.set(b.cx+Math.cos(b.a)*b.r,b.y+Math.sin(t*.7+b.sd)*.8,b.cz+Math.sin(b.a)*b.r);b.g.rotation.set(0,-b.a+(b.sp>0?0:Math.PI),b.sp>0?-.3:.3);
    const f=Math.sin(t*9+b.sd)*.6;b.wl.rotation.z=f;b.wr.rotation.z=-f;}}

/* ---------- loop */
let last=performance.now(),acc=0,time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  acc+=dt;while(acc>=1/60){tick(1/60);acc-=1/60;}time+=dt;
  animate(dt,time);updateParts(dt);controls.update();composer.render();}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);sizeTilt();});

</script>
