.cb b{display:block;height:10px;background:rgba(0,0,0,.65);border:1px solid #000;border-radius:3px;overflow:hidden}
.cb i{display:block;height:100%;width:0;background:linear-gradient(#ffe27a,#d99a1a)}

.n{position:absolute;left:0;top:0;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 0 #000;white-space:nowrap}
.n.c{font-size:28px}

.n.xp{color:#d3a6ff;font-size:15px}
.n.frost{color:#9fdcff}

.plate i{display:block;height:100%;width:100%;background:#e2533f}

#uf .port{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfe6ff,#2f7fd6 55%,#0b2f63);border:1.5px solid #9fd0ff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center}

<script type="module">

/* ---------- renderer, camera, light, post */

  if(Math.random()<.5)prop(Math.cos(a)*r,GY+.2,Math.sin(a)*r,.1,.4,.1,'#7a5a40');else prop(Math.cos(a)*r,GY+.08,Math.sin(a)*r,.3,.16,.26,'#8e959d');}
{
  const mesh=new THREE.InstancedMesh(box,new THREE.MeshLambertMaterial(),PROPS.length);
  const m=new THREE.Matrix4(),c=new THREE.Color();

const lanterns=[];for(const x of[-12,0,12]){const z=4*Math.sin(x*.16)+1.9;const g=G(scene,x,GY,z);
  B(g,.6,.3,.6,'#6b7179',0,.15,0);B(g,.32,1.7,.32,'#8a9098',0,1.1,0);B(g,.5,.1,.5,'#5a3d22',0,2,0);
  B(g,.44,.44,.44,'#3a3a3a',0,2.3,0);const l=B(g,.3,.3,.3,'#ffc46a',0,2.3,0,glow);l.castShadow=false;l.scale.set(.32,.32,.46);
  B(g,.5,.12,.5,'#f2f6fa',0,2.58,0);lanterns.push(l);}

const wgeo=new THREE.PlaneGeometry(260,260,90,90);wgeo.rotateX(-Math.PI/2);
const water=new THREE.Mesh(wgeo,new THREE.MeshLambertMaterial({color:0x3f78a4,flatShading:true}));water.position.y=.35;water.receiveShadow=true;scene.add(water);

  const o=B(scene,s,.25,s*rand(.6,1.1),'#eef5fb',Math.cos(a)*r,.45,Math.sin(a)*r);o.rotation.y=rand(0,3);floes.push({o,ph:rand(0,6)});}
/* snowfall */
const SNOW=700,snow=new THREE.InstancedMesh(box,bas('#dde7f0'),SNOW);snow.frustumCulled=false;scene.add(snow);
const sx=new Float32Array(SNOW),sy=new Float32Array(SNOW),sz=new Float32Array(SNOW),sp=new Float32Array(SNOW);
for(let i=0;i<SNOW;i++){const a=rand(0,6.3),r=Math.sqrt(Math.random())*40;sx[i]=Math.cos(a)*r;sz[i]=Math.sin(a)*r;sy[i]=rand(GY,GY+24);sp[i]=rand(1,2.2);}
const sm=new THREE.Matrix4();
function snowTick(dt,t){for(let i=0;i<SNOW;i++){sy[i]-=sp[i]*dt;sx[i]+=Math.sin(t*.7+i)*.4*dt+.25*dt;if(sy[i]<GY){sy[i]=GY+24;}if(sx[i]>40)sx[i]=-40;
  sm.makeScale(.09,.09,.09).setPosition(sx[i],sy[i],sz[i]);snow.setMatrixAt(i,sm);}snow.instanceMatrix.needsUpdate=true;}
const clouds=[];for(let i=0;i<6;i++){const g=G(scene,rand(-100,100),rand(26,33),rand(-70,30));
  for(let k=0,n=ri(6,10);k<n;k++)B(g,rand(2,4.5),rand(1.2,2),rand(2,3.5),'#f4f8fb',rand(-4,4),rand(-.5,.8),rand(-2,2)).castShadow=false;clouds.push({g,v:rand(.5,1.1)});}

  B(body,.96,.82,.56,M,0,1.34,0,mt);B(body,.92,.3,.54,'#5a4030',0,.84,0,mt);B(body,1,.14,.6,L,0,.98,0,mt);

  B(body,.5,.12,.04,M2,0,1.12,.29,mt);B(body,.5,.12,.04,M2,0,1.5,.29,mt);       // mail bands
  B(body,.6,.56,.56,SK,0,2.02,0,mt);B(body,.52,.18,.14,SK,0,1.82,.26,mt);        // head + jaw
  B(body,.07,.14,.06,'#f2ead8',.16,1.95,.33,mt);B(body,.07,.14,.06,'#f2ead8',-.16,1.95,.33,mt);
  B(body,.1,.08,.04,'#1a1a1a',.13,2.08,.285,mt);B(body,.1,.08,.04,'#1a1a1a',-.13,2.08,.285,mt);B(body,.52,.08,.06,'#3e6b2e',0,2.16,.29,mt);

  B(staff,.11,2.5,.11,'#5a3d22',0,-.75,0,mt);B(staff,.3,.08,.3,'#c23a2a',0,-1.25,0,mt);B(staff,.18,.16,.18,'#d9a93a',0,-1.92,0,mt);
  for(const [x,z] of[[.13,0],[-.13,0],[0,.13],[0,-.13]])B(staff,.05,.36,.05,'#d9a93a',x,-2.16,z,mt);

function wolfModel(){
  const root=new THREE.Group(),body=G(root);
  const mat=new THREE.MeshLambertMaterial({color:'#b9c9e0',emissive:'#2a4a7a',transparent:true,opacity:.85});

  const head=G(body,0,1.2,.85);W(head,.56,.5,.5,0,.05,.05);W(head,.3,.26,.42,0,-.05,.42);W(head,.12,.1,.06,0,0,.65,new THREE.MeshBasicMaterial({color:'#1a2030'}));

function eleAI(dt,eng){
  if(P.kite){P.kite.t-=dt;step(P,P.kite.p,6.5,dt);if(d2(P.pos,P.kite.p)<.3||P.kite.t<=0)P.kite=null;return;}   // run out of the Earthbind field
  const near=eng.filter(m=>d2(m.pos,P.pos)<4.4);
  const T=P.target=eng.reduce((a,b)=>b.hp<a.hp?b:a);face(P,T.pos);
  if(P.gcd>0)return;
  if(P.hp<P_HP*.4&&ready('hw')){use('hw');return;}
  if(near.length>=2&&!totems.nova&&ready('nova')){use('nova');return;}
  if(near.length&&!totems.eb&&ready('eb')){use('eb');kiteFrom(near);return;}
  if(!totems.sear&&ready('sear')){use('sear');return;}
  if(eng.length>=2&&ready('cl')){if(ready('em'))use('em');use('cl',T);return;}
  const low=near.find(m=>m.hp<m.max*.25)||eng.find(m=>m.hp<m.max*.2);if(low&&ready('es')){use('es',low);return;}
  const nfr=near.find(m=>!(m.slow>0)&&m.hp>m.max*.3);if(nfr&&ready('frost')){use('frost',nfr);return;}
  const nf=eng.find(m=>!m.dots.fs&&m.hp>m.max*.4);if(nf&&ready('fs')){use('fs',nf);return;}
  if(P.ls<=0&&P.mp>=600&&ready('ls')){use('ls');return;}
  if(eng.length===1&&ready('em'))use('em');
  if(ready('lb')){use('lb',T);return;}
  if(P.mp<AB.lb.mana&&d2(P.pos,T.pos)>3.4)step(P,T.pos,6.5,dt,3);   // out of mana: walk in and melee with the staff
}
function enhAI(dt,eng){
  const M=P.target=eng[0];const d=d2(P.pos,M.pos);face(P,M.pos);
  if(d>3.4&&!M.wasMoving)step(P,M.pos,6.5,dt,2.8);
  if(P.gcd>0)return;
  if(P.hp<P_HP*.45&&ready('hw')){use('hw');return;}
  if(!totems.soe&&ready('soe')){use('soe');return;}
  if(!totems.sear&&d<16&&ready('sear')){use('sear');return;}
  if(d>3.6)return;
  if(ready('ss')){use('ss',M);return;}
  if(!M.dots.fs&&M.hp>M.max*.35&&ready('fs')){use('fs',M);return;}
  if((P.ssBuff>0||M.hp<M.max*.25)&&P.mp>=300&&ready('es')){use('es',M);return;}
  if(P.ls<=0&&P.mp>=500&&ready('ls')){use('ls');return;}
}
function pAI(dt){
  if(P.cast){const t=P.cast.target;if(t&&!t.dead)face(P,t.pos);return;}
  if(P.drink>0)return;
  const live=alive();
  if(P.combat){if(P.wolf)leaveWolf();const eng=live.filter(m=>m.engaged);if(eng.length)(P.spec==='ele'?eleAI:enhAI)(dt,eng);return;}
  if(P.gcd>0)return;
  if(P.ls<=0&&ready('ls')){if(P.wolf)leaveWolf();use('ls');return;}
  if(P.spec==='enh'&&P.wfImbue<=0&&ready('wf')){if(P.wolf)leaveWolf();use('wf');return;}
  if(P.hp<P_HP*.6&&P.mp>=P_MP*.35&&ready('hw')){if(P.wolf)leaveWolf();use('hw');return;}
  if(P.mp<P_MP*.5||P.hp<P_HP*.65){if(P.wolf)leaveWolf();startDrink();return;}
  if(P.spec!==P.want){if(P.wolf){leaveWolf();return;}AB.spec.n=SPECS[P.want].name+' Spec';use('spec');return;}
  const T=live.filter(m=>m.pop>=1)[0];if(!T)return;P.target=T;
  const d=d2(P.pos,T.pos),pull=P.spec==='ele'?13.5:12;
  if(d>pull){if(!P.wolf&&d>pull+2&&ready('wolf')){use('wolf');return;}step(P,T.pos,P.wolf?11:6.5,dt,pull-.4);return;}
  if(P.wolf){leaveWolf();return;}
  face(P,T.pos);
  if(P.spec==='ele'){if(!totems.sear&&ready('sear')){use('sear');return;}if(ready('em'))use('em');if(ready('cl'))use('cl',T);return;}
  if(ready('lb'))use('lb',T);
}
function totemTick(dt){for(const k in totems){const t=totems[k];t.t-=dt;
  if(k==='nova'&&t.t<=0){const p=t.pos;ring(p,'#ff5a2a',.5,5.6,.6);ring(p,'#ffc23f',.4,4,.45);beam(p,'#ff6a2a',2,4,.5,.5);flash(p,0xff6a2a,70,.6);addShake(.25);
    for(let i=0;i<40;i++){const a=rand(0,6.3),s=rand(5,9);part(V(p.x,GY+.4,p.z),V(Math.cos(a)*s,rand(.5,3),Math.sin(a)*s),pick(['#ff5a1a','#ffa03a','#ffd23f']),rand(.12,.24),.6,-2,'g');}
    for(const m of alive())if(d2(m.pos,p)<5.6)hurtMob(m,ri(210,240),crit(.15),'fire');killTotem(k);continue;}
  if(t.t<=0||d2(t.pos,P.pos)>18){killTotem(k);continue;}
  if(k==='eb'){t.atk-=dt;if(t.atk<=0){t.atk=1.5;ring(t.pos,'#c9a86a',.25,8,.9,.5);
    for(let i=0;i<10;i++){const a=rand(0,6.3),r=rand(1,7.5);part(V(t.pos.x+Math.cos(a)*r,GY+.15,t.pos.z+Math.sin(a)*r),V(0,rand(.5,1.4),0),pick(['#8a6a3a','#a07a42','#6b5030']),.14,.7,-3,'s');}}
    for(const m of alive())if(d2(m.pos,t.pos)<8)m.slow=Math.max(m.slow,.6);continue;}
  const M=P.target&&!P.target.dead&&P.target.engaged?P.target:alive().find(m=>m.engaged);
  if(k==='sear'&&M&&d2(t.pos,M.pos)<18){t.atk-=dt;if(t.atk<=0){t.atk=2.2;
    shoot(t.top.getWorldPosition(V()),M,'#ff8a3a',()=>{hurtMob(M,ri(18,24),false,'fire');glowBurst(wpos2(M),'#ff8a3a',6,2);});}}}}

/* ---------- tick (fixed 60 Hz) */
const CASTC={hw:'#9ff0e0',wolf:'#b9c9e0'};
function tick(dt){
  P.moving=false;
  P.gcd-=dt;for(const k in P.cd)P.cd[k]-=dt;P.wfImbue-=dt;P.wfIcd-=dt;P.ssBuff-=dt;P.flash-=dt;
  P.mp=Math.min(P_MP,P.mp+dt*6);
  runLater(dt);
  P.combat=alive().some(m=>m.engaged);
  if(P.drink>0){P.drink-=dt;P.mp=Math.min(P_MP,P.mp+P_MP*.17*dt);P.hp=Math.min(P_HP,P.hp+P_HP*.14*dt);
    if((P.mp>=P_MP*.98&&P.hp>=P_HP*.98)||P.combat)P.drink=0;}
  pAI(dt);
  if(P.cast){P.cast.t+=dt;const id=P.cast.id;
    if(id==='spec'){const c=SPECS[P.want].c;for(let i=0;i<2;i++){const a=P.cast.t*9+i*3.14+rand(-.3,.3),r=1.3-P.cast.t*.3;
      part(V(P.pos.x+Math.cos(a)*r,GY+.2+P.cast.t*1.1+rand(-.2,.2),P.pos.z+Math.sin(a)*r),V(-Math.sin(a)*2,1,Math.cos(a)*2),pick([c,'#ffffff']),.12,.6,0,'g');}}
    else if(Math.random()<dt*25){const b=id==='hw'||id==='wolf'?handPos():castPos();part(b.add(V(rand(-.3,.3),rand(-.3,.3),rand(-.3,.3))),V(0,1,0),CASTC[id]||'#bfe6ff',.1,.4,0,'g');
      if(id==='cl'&&Math.random()<.15)bolt(castPos(),castPos().add(V(rand(-1,1),rand(-.2,1),rand(-1,1))),'#dff6ff',.04,.1,.3);}
    if(P.cast.t>=AB[id].cast){const c=P.cast;P.cast=null;if(!(c.target&&c.target.dead))FX[id](c.target);}}
  P.swing=Math.max(0,P.swing-dt);
  const MT=alive().filter(m=>m.engaged&&d2(P.pos,m.pos)<=3.7)[0];
  if(P.combat&&!P.cast&&!P.wolf&&P.swing<=0&&MT){P.swing=P.spec==='ele'?3:3.6;startSwing(1);after(.3,()=>meleeHit(MT,'auto'));}
  if(P.anim){P.anim.t+=dt;if(P.anim.t*P.anim.sp>.75)P.anim=null;}
  for(const m of[...mobs])mobAI(m,dt);
  totemTick(dt);
}

/* ---------- animate */
function animP(dt,t){
  const m=P.m,w=P.w,ele=P.spec==='ele';
  for(const r of[m.root,w.root]){r.position.set(P.pos.x,GY,P.pos.z);r.rotation.y=lerpAng(r.rotation.y,P.face,Math.min(1,dt*12));}
  m.root.visible=!P.wolf;w.root.visible=P.wolf;
  if(P.moving)P.walk+=dt*(P.wolf?15:10);
  if(P.wolf){legs(w.legs,P.walk,P.moving?.9:0);w.tail.rotation.x=.3+Math.sin(t*5)*.2;w.body.position.y=P.moving?Math.abs(Math.sin(P.walk))*.12:0;
    if(P.moving&&Math.random()<dt*30)part(V(P.pos.x+rand(-.4,.4),GY+rand(.4,1.4),P.pos.z+rand(-.4,.4)),V(0,.6,0),'#b9c9e0',rand(.12,.22),.6,0,'b');return;}
  const sit=P.drink>0;
  if(sit)for(const l of m.legs)l.rotation.x=damp(l.rotation.x,-1.45,10,dt);else legs(m.legs,P.walk,P.moving?.75:0);
  m.body.position.y=damp(m.body.position.y,sit?-.62:P.moving?Math.abs(Math.sin(P.walk))*.08:Math.sin(t*2)*.015,14,dt);
  if(P.anim){const s=P.anim.t*P.anim.sp;let ar,wr,lean;
    if(s<.22){const k=ease(s/.22);ar=lerp(-1.1,-2.95,k);wr=lerp(-.6,-.35,k);lean=-.12*k;}
    else if(s<.31){const k=(s-.22)/.09;ar=lerp(-2.95,-.55,k);wr=lerp(-.35,-.15,k);lean=lerp(-.12,.2,k);}
    else{const k=Math.min(1,(s-.31)/.44);ar=lerp(-.55,-1.1,ease(k));wr=lerp(-.15,-.6,k);lean=.2*(1-k);}
    m.armR.rotation.x=ar;m.armL.rotation.x=ar+.1;m.weapon.rotation.x=wr;m.body.rotation.x=lean;
    if(!ele&&s>.18&&s<.36)for(let k=0;k<2;k++)part(tipPos(),V(0,0,0),P.wfImbue>0?'#dff6ff':'#e8f0ff',.16,.25,0,'g');
  }else{let ar,wr,al;
    if(sit){ar=-.9;wr=-2.5;al=-1.3;}
    else if(P.cast&&P.cast.id==='spec'){ar=-2.4;wr=-1.1;al=-2.8;}
    else if(P.cast&&ele&&P.cast.id!=='hw'&&P.cast.id!=='wolf'){ar=-1.6;wr=-1.9;al=-1.4+Math.sin(t*10)*.1;}
    else if(P.cast){ar=-1;wr=-2.4;al=P.cast.id==='hw'?-2.9:-1.6;}
    else if(P.combat){ar=-1.1;wr=-.6;al=-1;}
    else{ar=-1;wr=-2.4;al=P.moving?-Math.sin(P.walk)*.5:0;}
    if(ele&&P.combat&&!P.cast){ar=-1.2;wr=-2.1;}
    m.armR.rotation.x=damp(m.armR.rotation.x,ar,12,dt);m.armL.rotation.x=damp(m.armL.rotation.x,al,12,dt);
    m.weapon.rotation.x=damp(m.weapon.rotation.x,wr,12,dt);m.body.rotation.x=damp(m.body.rotation.x,0,10,dt);}
  m.cup.visible=sit;if(sit&&Math.random()<dt*8)part(V(P.pos.x+rand(-.6,.6),GY+rand(.2,1.2),P.pos.z+rand(-.6,.6)),V(0,1.2,0),'#8fd0ff',.1,.8,0,'g');
  m.wfGlow.material.opacity=P.wfImbue>0?.35+.2*Math.sin(t*8):0;
  if(!ele&&P.wfImbue>0&&Math.random()<dt*8){const p=tipPos();part(p,V(rand(-1,1),rand(.3,1),rand(-1,1)),'#eaf8ff',.07,.4,0,'g');}
  if(ele){m.crystal.scale.set(.2,.3,.2).multiplyScalar(1+Math.sin(t*5)*.12);if(Math.random()<dt*6)part(m.crystal.getWorldPosition(V()),V(rand(-.3,.3),.8,rand(-.3,.3)),'#7fd0ff',.06,.5,0,'g');}
  m.orbs.rotation.y+=dt*2.2;m.orbs.children.forEach((o,i)=>{o.visible=i<P.ls;o.rotation.x+=dt*3;o.position.y=Math.sin(t*3+i*2)*.2;});
  if(P.em&&Math.random()<dt*30){const a=t*6+rand(-.3,.3)+(Math.random()<.5?Math.PI:0);part(V(P.pos.x+Math.cos(a)*1.1,GY+1.2+Math.sin(t*4)*.3,P.pos.z+Math.sin(a)*1.1),V(0,.3,0),Math.cos(a*3)>0?'#ff8a3a':'#7fd0ff',.1,.35,0,'g');}
  P.breath-=dt;if(P.breath<=0){P.breath=rand(2,3);const hp=m.body.localToWorld(V(0,1.9,.45));for(let i=0;i<4;i++)part(hp,V(rand(-.2,.2)+Math.sin(P.face)*.6,rand(.1,.4),Math.cos(P.face)*.6),'#e8eef4',rand(.08,.14),.9);}
  for(const x of m.mats)x.emissive.setHex(P.flash>0?0x441111:0);
}
function animate(dt,t){
  animP(dt,t);
  for(const m of mobs){animMob(m,dt,t);if(m.slow>0&&Math.random()<dt*10)part(V(m.pos.x+rand(-.6,.6),GY+rand(.2,m.top*.8),m.pos.z+rand(-.6,.6)),V(0,-.4,0),pick(['#dff4ff','#9fdcff']),.08,.7,0,'g');}
  for(const k in totems){const tt=totems[k];tt.pop=Math.min(1,tt.pop+dt*3);tt.g.scale.setScalar(tt.pop<1?ease(tt.pop)*(1+Math.sin(tt.pop*Math.PI)*.25):1);
    tt.top.rotation.y+=dt*(k==='nova'?6:2);tt.top.position.y=1.48+Math.sin(t*3)*.06;if(k==='sear')tt.top.scale.y=1+Math.sin(t*14)*.15;
    if(k==='nova'){const f=1-tt.t/3.2;tt.top.scale.setScalar(1+f*.9+Math.sin(t*(10+f*30))*.12*f);if(Math.random()<dt*(10+f*40))part(V(tt.pos.x+rand(-.3,.3),GY+1.5,tt.pos.z+rand(-.3,.3)),V(rand(-1.5,1.5),rand(.5,2),rand(-1.5,1.5)),pick(['#ff5a1a','#ffa03a']),.1,.4,0,'g');}
    if(Math.random()<dt*3)part(V(tt.pos.x+rand(-.3,.3),GY+.1,tt.pos.z+rand(-.3,.3)),V(0,1.2,0),TC[k],.08,.8,0,'g');}
  waves(t);snowTick(dt,t);floes.forEach(f=>f.o.position.y=.45+Math.sin(t*1.2+f.ph)*.06);
  lanterns.forEach((l,i)=>l.scale.y=.32*(1+Math.sin(t*9+i*2)*.08));
  for(const c of clouds){c.g.position.x+=c.v*dt;if(c.g.position.x>120)c.g.position.x=-120;}
}
function camFocus(){const tgt=V(P.pos.x,1,P.pos.z);const T=P.target&&!P.target.dead?P.target:alive()[0];if(T)tgt.lerp(V(T.pos.x,1,T.pos.z),P.combat?.4:.2);return tgt;}


/* ---------- loop */
let last=performance.now(),acc=0,time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  acc+=dt;while(acc>=1/60){tick(1/60);acc-=1/60;}time+=dt;
  animate(dt,time);updateParts(dt);updFx(dt);updShots(dt);updCallouts(dt);updNums(dt);updFlash(dt);updCastBar();updFrame();
  const tgt=camFocus();const nt=controls.target.clone().lerp(tgt,Math.min(1,dt*2));camera.position.add(nt.clone().sub(controls.target));controls.target.copy(nt);
  controls.update();
  shake=Math.max(0,shake-dt*.9);const o=V(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(shake*.6);
  camera.position.add(o);composer.render();camera.position.sub(o);}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

</script>
