<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Hunter Rotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a3266;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
canvas{display:block}
#layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ab{position:absolute;left:0;top:0;font:700 20px/1 "Cinzel",Georgia,serif;color:#fff;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.55)}
.cb{position:absolute;left:0;top:0;width:130px;display:none;text-align:center}
.cb span{display:block;font:700 13px/1 "Cinzel",Georgia,serif;color:#fff;text-shadow:0 1px 2px #000;margin-bottom:3px}
.cb b{display:block;height:10px;background:rgba(0,0,0,.65);border:1px solid #000;border-radius:3px;overflow:hidden}
.cb i{display:block;height:100%;width:0;background:linear-gradient(#ffe27a,#d99a1a)}
.cb.ch i{background:linear-gradient(#8fd0ff,#2f7fd6)}
.n{position:absolute;left:0;top:0;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 0 #000;white-space:nowrap}
.n.c{font-size:28px}
.n.nat{color:#9fe8ff}
.n.fire{color:#ffa04a}
.n.heal{color:#6dff7a;font-size:20px}
.n.taken{color:#ff6a55;font-size:14px}
.n.xp{color:#d3a6ff;font-size:15px}
.n.alert{color:#ff3a2a;font:700 32px/1 "Cinzel",serif}
.plate{position:absolute;left:0;top:0;width:78px;text-align:center;display:none}
.plate span{display:block;font:700 11px/1 -apple-system,sans-serif;color:#ff7a66;text-shadow:0 1px 2px #000;margin-bottom:2px;white-space:nowrap}
.plate b{display:block;height:6px;background:rgba(0,0,0,.6);border:1px solid #000;border-radius:2px;overflow:hidden}
.plate i{display:block;height:100%;width:100%;background:#e2533f}
#uf{position:fixed;left:14px;top:14px;display:flex;gap:9px;align-items:center;pointer-events:none;font:700 12px/1 -apple-system,sans-serif;color:#fff;text-shadow:0 1px 2px #000}

#uf .bars{width:180px}
#uf .nm{font:700 13px/1 "Cinzel",serif;color:#AAD372}
#uf .nm small{display:none}
#uf .bar{position:relative;height:17px;background:rgba(0,0,0,.6);border:1px solid #000;border-radius:2px;overflow:hidden;margin-top:2px}
#uf .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .15s}
#uf .hp i{background:linear-gradient(#5ee05a,#2a9a28)}
#uf .mp i{background:linear-gradient(#5aa8ff,#1f5fd0)}
#uf .bar span{position:relative;display:block;text-align:center;font-size:12px;line-height:17px}

#uf .pet{margin-top:4px}
#uf .pet .bar{height:7px;width:120px;margin-top:3px}
#uf .pet .bar i{background:linear-gradient(#5ee05a,#2a9a28)}
.n.nat{color:#9be27a}
.n.arc{color:#ff9aff}
.n.pet{color:#fff;font-size:13px;opacity:.85}
.n.heal{color:#6dff7a;font-size:16px}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-(1-t)*(1-t);
const lerpAng=(a,b,t)=>{const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;};
const damp=(c,t,k,dt)=>c+(t-c)*Math.min(1,k*dt);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- renderer, camera, light, post */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;

const SKY=0x2a3266;
const scene=new THREE.Scene();scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,40,130);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,400);
camera.position.set(0,22,30);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=1.3;controls.minDistance=10;controls.maxDistance=70;
controls.target.set(0,1,0);controls.autoRotate=true;controls.autoRotateSpeed=.35;
scene.add(new THREE.HemisphereLight(0xb8c4ff,0x2f4a46,1.05));
const sun=new THREE.DirectionalLight(0xc8d4ff,1.35);sun.position.set(35,40,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;
Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,far:140});
sun.shadow.camera.updateProjectionMatrix();scene.add(sun);
const fxLight=new THREE.PointLight(0x9fe8ff,0,16,1.5);scene.add(fxLight);   // reused for every spell flash
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio,2));

composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.45,.86));

/* ---------- materials + voxel helpers */
const box=new THREE.BoxGeometry(1,1,1);
const ML={};const lam=c=>ML[c]||(ML[c]=new THREE.MeshLambertMaterial({color:c}));
const MBc={};const bas=c=>MBc[c]||(MBc[c]=new THREE.MeshBasicMaterial({color:c}));
const MG={};const glow=c=>MG[c]||(MG[c]=new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(3)}));
const addMat=(c,o=1,side=THREE.FrontSide)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side});
function B(p,sx,sy,sz,c,x,y,z,mat){const o=new THREE.Mesh(box,mat?mat(c):lam(c));o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;}
function G(p,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g;}
const ringGeo=new THREE.RingGeometry(.86,1,48).rotateX(-Math.PI/2);
const cylGeo=new THREE.CylinderGeometry(1,1,1,24,1,true);
function ms(){const c={},list=[];const f=k=>c[k]||(list.push(c[k]=new THREE.MeshLambertMaterial({color:k})),c[k]);f.list=list;return f;}

/* ---------- particles, timed effects, scheduled events */
const parts=[];
function part(pos,vel,color,size,life,grav=0,mode='b'){
  const o=new THREE.Mesh(box,mode==='s'?lam(color):mode==='g'?glow(color):bas(color));o.position.copy(pos);
  const s=size.isVector3?size.clone():V(size,size,size);o.scale.copy(s);o.castShadow=mode==='s';scene.add(o);
  parts.push({o,vel,life,max:life,s,grav,solid:mode==='s'});
}
const burst=(p,c,n=8)=>{for(let i=0;i<n;i++)part(p,V(rand(-3,3),rand(0,4),rand(-3,3)),c,.15,.45,-8);};
const glowBurst=(p,c,n=12,s=4)=>{for(let i=0;i<n;i++)part(p,V(rand(-s,s),rand(0,s),rand(-s,s)),c,rand(.1,.2),rand(.35,.6),-6,'g');};
const motes=(p,c,n=14,r=1)=>{for(let i=0;i<n;i++){const a=rand(0,6.3),rr=rand(0,r);part(V(p.x+Math.cos(a)*rr,GY+rand(0,.6),p.z+Math.sin(a)*rr),V(0,rand(1.5,3.5),0),c,rand(.08,.15),rand(.7,1.2),0,'g');}};
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
  if(p.life<=0){scene.remove(p.o);parts.splice(i,1);continue;}
  p.vel.y+=p.grav*dt;p.o.position.addScaledVector(p.vel,dt);
  if(p.solid&&p.o.position.y<GY+p.s.y/2){p.o.position.y=GY+p.s.y/2;p.vel.multiplyScalar(.5);p.vel.y=Math.abs(p.vel.y)*.3;}
  p.o.scale.copy(p.s).multiplyScalar(p.solid?Math.min(1,p.life/.4):p.life/p.max);}}
const fx=[];
function addFx(o,dur,upd,own=true){scene.add(o);fx.push({o,t:0,dur,upd,own});upd(o,0);}
function updFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const k=f.t/f.dur;
  if(k>=1){scene.remove(f.o);if(f.own)f.o.material.dispose();fx.splice(i,1);continue;}f.upd(f.o,k);}}
function ring(p,c,r0,r1,dur=.6,o=.9){const m=new THREE.Mesh(ringGeo,addMat(c,o));m.position.set(p.x,GY+.06,p.z);
  addFx(m,dur,(m,k)=>{const r=lerp(r0,r1,ease(k));m.scale.set(r,1,r);m.material.opacity=o*(1-k);});}
function beam(p,c,r,h,dur=1,o=.5){const m=new THREE.Mesh(cylGeo,addMat(c,0,THREE.DoubleSide));m.position.set(p.x,GY+h/2,p.z);
  addFx(m,dur,(m,k)=>{m.material.opacity=Math.sin(k*Math.PI)*o;const s=r*(1-k*.35);m.scale.set(s,h,s);});}
function bolt(a,b,c='#bfe6ff',w=.09,dur=.2,jag=.55){   // jagged lightning: chain of glowing voxel segments
  const g=new THREE.Group();let prev=a.clone();const n=Math.max(4,Math.round(a.distanceTo(b)/1.2));
  for(let i=1;i<=n;i++){const p=a.clone().lerp(b,i/n);if(i<n)p.add(V(rand(-jag,jag),rand(-jag,jag),rand(-jag,jag)));
    const s=new THREE.Mesh(box,glow(c));s.scale.set(w,w,prev.distanceTo(p)+w);s.position.copy(prev).lerp(p,.5);s.lookAt(p);g.add(s);prev=p;}
  addFx(g,dur,(g,k)=>{g.visible=k<.4||Math.random()>.35;for(const s of g.children){s.scale.x=s.scale.y=w*(1-k*.7);}},false);}
let FL=null;const flash=(p,c,peak,dur)=>{fxLight.position.set(p.x,GY+2.2,p.z);fxLight.color.set(c);FL={t:0,dur,peak};};
let shake=0;const addShake=a=>shake=Math.max(shake,a);
const later=[];const after=(t,fn)=>later.push({t,fn});
const shots=[];   // small glowing projectiles (Searing Totem)
function shoot(from,target,c,onHit){const o=B(scene,.22,.22,.22,c,from.x,from.y,from.z,glow);o.castShadow=false;shots.push({o,target,c,onHit});}
function updShots(dt){for(let i=shots.length-1;i>=0;i--){const s=shots[i],T=s.target;
  if(T.dead){scene.remove(s.o);shots.splice(i,1);continue;}
  const tp=wpos2(T),dir=tp.sub(s.o.position);
  if(dir.length()<22*dt+.3){scene.remove(s.o);shots.splice(i,1);s.onHit();continue;}
  s.o.position.addScaledVector(dir.normalize(),22*dt);s.o.rotation.x+=dt*10;part(s.o.position.clone(),V(0,.5,0),s.c,.12,.3,0,'g');}}

/* ---------- screen-space UI */
const layer=document.getElementById('layer');
const pv=V();const scr=p=>{pv.copy(p).project(camera);return [(pv.x+1)/2*innerWidth,(1-pv.y)/2*innerHeight,pv.z>1];};
const callouts=[];
function callout(ent,text,color){
  for(const c of callouts)if(c.ent===ent)c.lift+=22;
  const el=document.createElement('div');el.className='ab';el.textContent=text;el.style.color=color;layer.appendChild(el);
  callouts.push({el,ent,t:0,lift:0});}
function updCallouts(dt){for(let i=callouts.length-1;i>=0;i--){const c=callouts[i];c.t+=dt;
  if(c.t>1.6){c.el.remove();callouts.splice(i,1);continue;}
  const [x,y]=scr(V(c.ent.pos.x,GY+c.ent.top+.9,c.ent.pos.z));
  const pop=c.t<.12?.6+c.t/.12*.5:c.t<.22?1.1-(c.t-.12)/.1*.1:1;
  const up=c.lift+c.t*34+(c.t>1?(c.t-1)*40:0);
  c.el.style.transform=`translate(${x}px,${y-up}px) translate(-50%,-50%) scale(${pop})`;
  c.el.style.opacity=c.t<1?1:Math.max(0,1-(c.t-1)/.6);}}
const cb=document.createElement('div');cb.className='cb';cb.innerHTML='<span></span><b><i></i></b>';layer.appendChild(cb);
const nums=[];
function num(ent,text,cls=''){const el=document.createElement('div');el.className='n '+cls;el.textContent=text;layer.appendChild(el);
  nums.push({el,p:V(ent.pos.x+rand(-.6,.6),GY+ent.top-.2,ent.pos.z+rand(-.3,.3)),t:0,life:cls.includes('c')||cls==='alert'?1.3:1});}
function mkPlate(name){const el=document.createElement('div');el.className='plate';el.innerHTML=`<span>${name}</span><b><i></i></b>`;layer.appendChild(el);return el;}
const ufHp=document.querySelector('#uf .hp i'),ufHpT=document.querySelector('#uf .hp span'),ufMp=document.querySelector('#uf .mp i'),ufMpT=document.querySelector('#uf .mp span'),buffsEl=document.getElementById('buffs');
let buffsKey='';

/* ---------- shared kit: movement, mobs, mob animation, HUD */
function step(e,tp,speed,dt,stop=0){const dx=tp.x-e.pos.x,dz=tp.z-e.pos.z,d=Math.hypot(dx,dz);if(d<=stop)return;
  const s=Math.min(speed*dt,d-stop);e.pos.x+=dx/d*s;e.pos.z+=dz/d*s;e.face=Math.atan2(dx,dz);e.moving=true;
  const r=Math.hypot(e.pos.x,e.pos.z);if(r>PLAY){e.pos.x*=PLAY/r;e.pos.z*=PLAY/r;}}
const face=(e,p)=>e.face=Math.atan2(p.x-e.pos.x,p.z-e.pos.z);
function legs(ls,phase,amt){ls.forEach((l,i)=>l.rotation.x=Math.sin(phase+(i===1||i===2?Math.PI:0))*amt);}

const mobs=[];
const wpos2=m=>V(m.pos.x,GY+m.top*.48,m.pos.z);
const alive=()=>mobs.filter(m=>!m.dead);
function makeMob(p,def){
  const m={pos:p.clone(),home:p.clone(),wp:p.clone(),face:rand(0,6.3),m:def.model(),top:def.top,hp:def.hp,max:def.hp,walk:0,moving:false,wasMoving:false,
    engaged:false,atk:rand(.5,1.2),lunge:0,flash:0,knock:0,dead:false,pop:0,wait:rand(1,3),stun:0,fear:0,fearDir:0,slow:0,dots:{},def,target:null,plate:mkPlate(def.name)};
  m.m.root.scale.setScalar(.01);m.m.root.position.set(p.x,GY,p.z);scene.add(m.m.root);mobs.push(m);return m;}
function spawnPack(n,def,minD=20,spread=2.2){
  let c,tries=0;do{const a=Math.atan2(-P.pos.z,-P.pos.x)+rand(-1,1),r=rand(8,PLAY-2);c=V(Math.cos(a)*r,0,Math.sin(a)*r);}while(d2(c,P.pos)<minD&&++tries<80);
  const out=[];for(let i=0;i<n;i++){const a=i/n*6.28+rand(-.3,.3),s=n>1?spread:0;out.push(makeMob(V(c.x+Math.cos(a)*s,0,c.z+Math.sin(a)*s),def));}
  return out;}
function aggro(m,link=true){if(m.dead||m.engaged)return;m.engaged=true;num(m,'!','alert');
  if(link&&m.def.link)for(const o of mobs)if(o!==m&&!o.dead&&!o.engaged&&d2(o.pos,m.pos)<9)after(rand(.25,.6),()=>aggro(o,false));}
function hurtMob(m,amt,c=false,kind=''){
  if(!m||m.dead)return 0;amt=Math.round(amt*(c?2:1));m.hp-=amt;m.flash=.1;m.knock=.16;
  num(m,amt,kind+(c?' c':''));aggro(m);if(m.hp<=0)killMob(m);return amt;}
function shatter(root,mult=1){root.updateMatrixWorld(true);
  root.traverse(o=>{if(o.isMesh&&o.visible&&o.material&&o.material.color){const p=V(),s=V();o.getWorldPosition(p);o.getWorldScale(s);
    part(p,V(rand(-3,3)*mult,rand(3,7),rand(-3,3)*mult),'#'+o.material.color.getHexString(),s,rand(1.2,2),-20,'s');}});}
function killMob(m){
  m.dead=true;shatter(m.m.root);scene.remove(m.m.root);m.plate.remove();m.dots={};num(P,'+'+ri(m.def.xp[0],m.def.xp[1])+' XP','xp');
  if(typeof onMobDeath==='function')onMobDeath(m);
  const i=mobs.indexOf(m);if(i>=0)mobs.splice(i,1);
  if(!mobs.length)after(3,spawnNext);}
function mobAI(m,dt){
  m.pop=Math.min(1,m.pop+dt*1.5);m.flash-=dt;m.lunge-=dt;m.knock-=dt;m.stun-=dt;m.fear-=dt;m.slow-=dt;m.moving=false;
  for(const k in m.dots){const d=m.dots[k];d.t-=dt;d.tick-=dt;
    if(d.tick<=0){d.tick=d.every;hurtMob(m,ri(d.lo,d.hi),false,d.kind||'');if(m.dead)return;}
    if(d.fx&&Math.random()<dt*8)d.fx(m);if(d.t<=0)delete m.dots[k];}
  for(const o of mobs)if(o!==m&&!o.dead){const dd=d2(o.pos,m.pos);if(dd<1.7&&dd>.01){const k=(1.7-dd)*dt*3;m.pos.x+=(m.pos.x-o.pos.x)/dd*k;m.pos.z+=(m.pos.z-o.pos.z)/dd*k;}}
  for(const o of[P,typeof pet!=='undefined'?pet:null]){if(!o)continue;const gap=(m.def.sep||1.9)+(o.sep||0),dd=d2(o.pos,m.pos);
    if(dd<gap&&dd>.01){const k=Math.min(gap-dd,dt*8),q=o.moving?o:m,sg=q===m?1:-1;q.pos.x+=sg*(m.pos.x-o.pos.x)/dd*k;q.pos.z+=sg*(m.pos.z-o.pos.z)/dd*k;}}
  if(m.stun>0||m.pop<1){m.wasMoving=false;return;}
  if(!m.engaged){m.wait-=dt;if(m.wait<=0){m.wait=rand(3,6);m.wp=m.home.clone().add(V(rand(-2,2),0,rand(-2,2)));}step(m,m.wp,1.2,dt,.3);m.wasMoving=m.moving;return;}
  if(m.fear>0){if(Math.random()<dt*1.5)m.fearDir+=rand(-1.2,1.2);step(m,V(m.pos.x+Math.sin(m.fearDir)*3,0,m.pos.z+Math.cos(m.fearDir)*3),3.4,dt);m.wasMoving=m.moving;return;}
  const tgt=(m.target&&!m.target.dead&&m.target.active!==false)?m.target:P,reach=m.def.reach||3,d=d2(m.pos,tgt.pos);
  if(d>reach+.15)step(m,tgt.pos,m.slow>0?2.8:(m.def.speed||6),dt,reach);
  else{face(m,tgt.pos);m.atk-=dt;if(m.atk<=0){m.atk=(m.def.atk||2.2)*(m.slow>0?1.35:1);m.lunge=.55;
    after(.32,()=>{if(!m.dead&&m.stun<=0&&m.fear<=0&&d2(m.pos,tgt.pos)<reach+1.3){(tgt.onHit||hurtP)(ri(m.def.dmg[0],m.def.dmg[1]),m);addShake(.05);}});}}
  m.wasMoving=m.moving;}
function stunStars(m,t){if(Math.random()<.5)return;const a=t*7+rand(0,6.3);part(V(m.pos.x+Math.cos(a)*.6,GY+m.top+.2,m.pos.z+Math.sin(a)*.6),V(-Math.sin(a)*2,0,Math.cos(a)*2),'#ffe27a',.12,.3,0,'g');}

const pet={pos:V(-1.5,0,8.5),face:0,m:saberModel(),top:2.1,walk:0,moving:false,hp:PET_HP,flash:0,target:null,atk:0,anim:0,bw:0,growl:0,active:true,
  onHit(amt,src){pet.hp=Math.max(1,pet.hp-amt);pet.flash=.1;num(pet,'-'+amt,'pet');}};
scene.add(P.m.root,pet.m.root);
const petHp=document.getElementById('pethp');
function spawnNext(){spawnPack(2,FURB,21,2.4);}
spawnNext();
function hurtP(amt,src){P.hp=Math.max(1,P.hp-amt);P.flash=.1;num(P,'-'+amt,'taken');if(P.cast){P.cast.t-=.4;}}
function onMobDeath(m){if(pet.target===m)pet.target=null;}

/* arrows: oriented shafts with a glowing trail */
const arrows=[];
function arrow(target,c,onHit,sp=34){const from=P.m.armL.localToWorld(V(0,-.7,.3));const g=new THREE.Group();
  B(g,.05,.05,.9,'#e8e0d0',0,0,0,bas).castShadow=false;const h=B(g,.12,.12,.16,c,0,0,.48,glow);h.castShadow=false;
  g.position.copy(from);scene.add(g);arrows.push({g,target,c,onHit,sp});}
function updArrows(dt){for(let i=arrows.length-1;i>=0;i--){const a=arrows[i],T=a.target;
  if(T.dead){scene.remove(a.g);arrows.splice(i,1);continue;}
  const tp=wpos2(T),dir=tp.clone().sub(a.g.position);
  if(dir.length()<a.sp*dt+.3){scene.remove(a.g);arrows.splice(i,1);a.onHit();continue;}
  a.g.lookAt(tp);a.g.position.addScaledVector(dir.normalize(),a.sp*dt);part(a.g.position.clone(),V(0,0,0),a.c,.09,.25,0,'g');}}

/* ---------- abilities (classic Beast Mastery kit; demo cooldowns compressed) */
const AB={
  hawk:{n:'Aspect of the Hawk',c:'#ffb05a',mana:60},
  mark:{n:"Hunter's Mark",c:'#ff5a4a',mana:60},
  sting:{n:'Serpent Sting',c:'#9be27a',mana:90},
  aimed:{n:'Aimed Shot',c:'#ffe27a',mana:160,cast:2.5,cd:9},
  arcane:{n:'Arcane Shot',c:'#ff9aff',mana:110,cd:6},
  multi:{n:'Multi-Shot',c:'#ffe27a',mana:150,cd:8},
  bw:{n:'Bestial Wrath',c:'#ff3a2a',mana:0,cd:60},
  conc:{n:'Concussive Shot',c:'#bfe6ff',mana:60,cd:12},
  clip:{n:'Wing Clip',c:'#ffffff',mana:40,cd:4},
  mend:{n:'Mend Pet',c:'#6dff7a',mana:250,chan:4},
};
const ready=id=>{const a=AB[id];return !(P.cd[id]>0)&&P.gcd<=0&&!P.cast&&!P.chan&&P.mp>=a.mana;};
function use(id,t=null){const a=AB[id];P.mp-=a.mana;P.gcd=1.5;if(a.cd)P.cd[id]=a.cd;
  if(a.cast){P.cast={id,t:0,target:t};return;}
  if(a.chan){P.chan={id,t:0,dur:a.chan,target:t,tick:1};callout(P,a.n,a.c);return;}
  callout(P,a.n,a.c);FX[id](t);}
const crit=(p=.2)=>Math.random()<p;
const anim=(type,sp=1)=>P.anim={type,t:0,sp};
const markBonus=m=>m.marked>0?1.1:1;
const FX={
  hawk(){P.hawk=300;for(let k=0;k<2;k++)after(k*.12,()=>ring(P.pos,'#ffb05a',.4,2.6,.5,.8));glowBurst(V(P.pos.x,GY+2.6,P.pos.z),'#ffb05a',16,3);},
  mark(t){t.marked=60;glowBurst(V(t.pos.x,GY+t.top+.6,t.pos.z),'#ff5a4a',12,2);},
  sting(t){anim('shot',2);arrow(t,'#9be27a',()=>{hurtMob(t,ri(30,40),false,'nat');t.dots.sting={t:15,tick:3,every:3,lo:44,hi:52,kind:'nat',
    fx:m=>part(V(m.pos.x+rand(-.5,.5),GY+rand(.6,2.2),m.pos.z+rand(-.5,.5)),V(0,.8,0),pick(['#7ad84a','#c8ff6a']),.1,.6,0,'g')};});},
  aimed(t){anim('shot',1.4);arrow(t,'#ffe27a',()=>{hurtMob(t,Math.round(ri(360,420)*markBonus(t)),crit(.3));glowBurst(wpos2(t),'#ffe27a',18,4);flash(t.pos,0xffe27a,30,.35);addShake(.12);},48);},
  arcane(t){anim('shot',2);arrow(t,'#ff9aff',()=>{hurtMob(t,Math.round(ri(170,200)*markBonus(t)),crit(),'arc');glowBurst(wpos2(t),'#ff9aff',14,3);ring(t.pos,'#ff9aff',.4,2,.4);},44);},
  multi(){anim('shot',2);for(const m of alive())if(m.engaged&&d2(m.pos,P.pos)<30)arrow(m,'#ffe27a',()=>{hurtMob(m,Math.round(ri(150,180)*markBonus(m)),crit());burst(wpos2(m),'#ffe27a',8);},38);},
  bw(){pet.bw=12;ring(pet.pos,'#ff3a2a',.4,3,.5);glowBurst(V(pet.pos.x,GY+1.2,pet.pos.z),'#ff3a2a',22,4);flash(pet.pos,0xff3a2a,40,.6);addShake(.15);callout(pet,'Bestial Wrath','#ff3a2a');},
  conc(t){anim('shot',2);arrow(t,'#bfe6ff',()=>{hurtMob(t,ri(20,30));t.slow=4;t.stun=.3;ring(t.pos,'#bfe6ff',.4,2.4,.4);burst(wpos2(t),'#dff6ff',12);},44);},
  clip(t){anim('kick',1.6);after(.12,()=>{if(t.dead)return;hurtMob(t,ri(40,50));t.slow=6;burst(wpos2(t),'#ffffff',8);});P.kite=1.4;},
};
function startDrink(){P.drink=7;callout(P,'Drink','#8fd0ff');}
function petGrowl(m){if(pet.growl>0||m.dead)return false;pet.growl=18;m.target=pet;pet.target=m;callout(pet,'Growl','#ffb05a');
  for(let k=0;k<2;k++)after(k*.1,()=>ring(pet.pos,'#ffb05a',.4,2.6,.4,.7));return true;}

/* ---------- AI: the rotation */
function pAI(dt){
  if(P.cast){const t=P.cast.target;if(t&&!t.dead)face(P,t.pos);return;}
  if(P.chan){face(P,pet.pos);return;}
  if(P.drink>0)return;
  const live=alive();
  if(P.kite>0){const T=live.filter(m=>m.target!==pet&&m.engaged).sort((a,b)=>d2(a.pos,P.pos)-d2(b.pos,P.pos))[0]||P.target;
    if(T){let ax=P.pos.x-T.pos.x,az=P.pos.z-T.pos.z;const l=Math.hypot(ax,az)||1;ax/=l;az/=l;const r=Math.hypot(P.pos.x,P.pos.z);
      if(r>PLAY-4){const tx=-P.pos.z/r,tz=P.pos.x/r,s=Math.sign(ax*tx+az*tz)||1;ax=ax*.3+tx*s-P.pos.x/r*.4;az=az*.3+tz*s-P.pos.z/r*.4;}   // curve along the edge instead of pinning
      step(P,V(P.pos.x+ax*3,0,P.pos.z+az*3),6.8,dt);
      if(P.kite<.25)face(P,T.pos);}
    return;}
  if(P.combat){
    const onMe=live.filter(m=>m.engaged&&m.target!==pet);
    if(!P.target||P.target.dead)P.target=live.filter(m=>m.engaged).sort((a,b)=>(a.target===pet?0:1)-(b.target===pet?0:1)||a.hp-b.hp)[0];
    const T=P.target;if(!T)return;
    if(!pet.target){pet.target=T;callout(P,'Attack!','#AAD372');}
    for(const m of onMe)if(petGrowl(m))break;
    const chaser=onMe.slice().sort((a,b)=>d2(a.pos,P.pos)-d2(b.pos,P.pos))[0],dc=chaser?d2(chaser.pos,P.pos):99;
    if(chaser&&dc<3.6&&ready('clip')){face(P,chaser.pos);use('clip',chaser);return;}
    if(chaser&&dc>=3.6&&chaser.slow<=0&&chaser.stun<=0&&ready('conc')){face(P,chaser.pos);use('conc',chaser);return;}
    if(chaser&&dc<7&&!P.cast){P.kite=chaser.slow>0?1:.7;return;}       // back-pedal, turn, shoot
    const d=d2(P.pos,T.pos);face(P,T.pos);
    if(d>24)step(P,T.pos,6.5,dt,22);
    if(pet.hp<PET_HP*.4&&ready('mend')){use('mend',pet);return;}
    if(P.gcd>0)return;
    if(!(pet.bw>0)&&ready('bw')&&pet.target){use('bw');return;}
    if(live.filter(m=>m.engaged).length>1&&ready('multi')){use('multi');return;}
    if(!T.dots.sting&&T.hp>T.max*.4&&ready('sting')){use('sting',T);return;}
    if(!onMe.length&&ready('aimed')){use('aimed',T);return;}
    if(ready('arcane')){use('arcane',T);return;}
    return;
  }
  if(P.gcd>0)return;
  if(P.hawk<=0&&ready('hawk')){use('hawk');return;}
  if(pet.hp<PET_HP*.7&&ready('mend')){use('mend',pet);return;}
  if(P.mp<P_MP*.5||P.hp<P_HP*.6){startDrink();return;}
  const T=live.filter(m=>m.pop>=1).sort((a,b)=>d2(a.pos,P.pos)-d2(b.pos,P.pos))[0];if(!T)return;
  P.target=T;const d=d2(P.pos,T.pos);
  if(d>20){step(P,T.pos,6.5,dt,19);return;}
  face(P,T.pos);
  if(!(T.marked>0)&&ready('mark')){use('mark',T);return;}
  if(ready('aimed'))use('aimed',T);
}
function petAI(dt){
  pet.moving=false;pet.flash-=dt;pet.bw-=dt;pet.growl-=dt;pet.anim-=dt;
  const T=pet.target&&!pet.target.dead?pet.target:null;
  if(!T){pet.target=null;const home=V(P.pos.x-Math.sin(P.face+.8)*2,0,P.pos.z-Math.cos(P.face+.8)*2);if(d2(pet.pos,home)>1.2)step(pet,home,d2(pet.pos,home)>5?9:6,dt,.6);
    if(!P.combat)pet.hp=Math.min(PET_HP,pet.hp+PET_HP*.01*dt);return;}
  const d=d2(pet.pos,T.pos);
  if(d>2.6){step(pet,T.pos,10,dt,2.2);return;}
  face(pet,T.pos);
  if(!T.engaged||T.target!==pet){if(!T.engaged)aggro(T);if(T.target!==pet)petGrowl(T);}
  pet.atk-=dt;if(pet.atk<=0){pet.atk=pet.bw>0?1.4:2;pet.anim=.4;const m=T;
    after(.15,()=>{if(m.dead)return;hurtMob(m,Math.round(ri(70,90)*(pet.bw>0?1.5:1)*markBonus(m)),crit(.15));burst(wpos2(m),pet.bw>0?'#ff6a4a':'#ffffff',6);});}
}

/* ---------- tick (fixed 60 Hz) */
function tick(dt){
  P.moving=false;
  P.gcd-=dt;for(const k in P.cd)P.cd[k]-=dt;P.flash-=dt;P.hawk-=dt;P.kite-=dt;P.auto-=dt;
  for(const m of mobs)if(m.marked>0)m.marked-=dt;
  runLater(dt);
  P.mp=Math.min(P_MP,P.mp+dt*(P.combat?4:8));
  P.combat=alive().some(m=>m.engaged);
  if(P.drink>0){P.drink-=dt;P.mp=Math.min(P_MP,P.mp+P_MP*.16*dt);P.hp=Math.min(P_HP,P.hp+P_HP*.12*dt);pet.hp=Math.min(PET_HP,pet.hp+PET_HP*.1*dt);
    if((P.mp>=P_MP*.98&&P.hp>=P_HP*.98)||P.combat)P.drink=0;}
  pAI(dt);petAI(dt);
  if(P.cast){P.cast.t+=dt;const id=P.cast.id;
    if(Math.random()<dt*20)part(P.m.armR.localToWorld(V(0,-.7,.2)),V(0,.6,0),'#ffe27a',.08,.4,0,'g');
    if(P.cast.t>=AB[id].cast){const c=P.cast;P.cast=null;if(!(c.target&&c.target.dead))FX[id](c.target);}}
  if(P.chan){const C=P.chan;C.t+=dt;C.tick-=dt;if(C.tick<=0){C.tick=1;const h=ri(150,170);pet.hp=Math.min(PET_HP,pet.hp+h);num(pet,'+'+h,'heal');}
    if(Math.random()<dt*20){const a=P.m.armL.localToWorld(V(0,-.7,0)),b=V(pet.pos.x,GY+1.2,pet.pos.z);part(a.clone().lerp(b,Math.random()),V(0,.5,0),'#6dff7a',.1,.4,0,'g');}
    if(C.t>=C.dur)P.chan=null;}
  const T=P.target;
  if(P.combat&&!P.cast&&!P.chan&&P.kite<=0&&T&&!T.dead&&P.auto<=0&&d2(P.pos,T.pos)>5&&d2(P.pos,T.pos)<26){P.auto=P.hawk>0?2:2.4;if(!P.anim)anim('shot',1.6);
    arrow(T,'#fff4d8',()=>{hurtMob(T,Math.round(ri(95,120)*markBonus(T)),crit());burst(wpos2(T),'#fff4d8',4);},32);}
  if(P.anim){P.anim.t+=dt;if(P.anim.t*P.anim.sp>.6)P.anim=null;}
  for(const m of[...mobs])mobAI(m,dt);
  updArrows(dt);
}

/* ---------- animate */
function animP(dt,t){
  const m=P.m;m.root.position.set(P.pos.x,GY,P.pos.z);m.root.rotation.y=lerpAng(m.root.rotation.y,P.face,Math.min(1,dt*12));
  if(P.moving)P.walk+=dt*11;
  const sit=P.drink>0;
  if(sit)for(const l of m.legs)l.rotation.x=damp(l.rotation.x,-1.45,10,dt);else legs(m.legs,P.walk,P.moving?.75:0);
  m.body.position.y=damp(m.body.position.y,sit?-.62:P.moving?Math.abs(Math.sin(P.walk))*.07:Math.sin(t*2)*.02,14,dt);
  let al,ar,az=0,bodyY=0;const A=P.anim;
  const aiming=P.cast&&P.cast.id==='aimed';
  if(sit){al=-.5;ar=-1.3;}
  else if(aiming){al=-1.57;ar=-1.57;az=.5;bodyY=-.5;}
  else if(A&&A.type==='shot'){const s=Math.min(1,A.t*A.sp/.6);al=-1.57;ar=-1.57;az=s<.6?lerp(0,.6,s/.6):lerp(.6,0,(s-.6)/.4);bodyY=-.5;}
  else if(A&&A.type==='kick'){const s=Math.min(1,A.t*A.sp/.6);al=-.4;ar=-.4;m.legs[0].rotation.x=-1.4*Math.sin(s*Math.PI);}
  else if(P.chan){al=-1.4;ar=-.4;}
  else if(P.combat){al=-1.3;ar=-.8;bodyY=-.3;}
  else{al=P.moving?-Math.sin(P.walk)*.45:-.2;ar=P.moving?Math.sin(P.walk)*.45:-.1;}
  m.armL.rotation.x=damp(m.armL.rotation.x,al,16,dt);m.armR.rotation.x=damp(m.armR.rotation.x,ar,16,dt);m.armR.rotation.z=damp(m.armR.rotation.z,-az,16,dt);
  m.body.rotation.y=damp(m.body.rotation.y,bodyY,10,dt);
  const up=bodyY?1:0;m.bow.rotation.x=damp(m.bow.rotation.x,up*Math.PI/2,12,dt);m.bow.rotation.z=damp(m.bow.rotation.z,up*.5,12,dt);
  const drawn=aiming?1:(A&&A.type==='shot')?Math.sin(Math.min(1,A.t*A.sp/.6)*Math.PI*.8):0;
  m.nock.visible=drawn>.15;const pull=-.2-drawn*.42;m.nock.position.z=pull+.2;
  for(const [sg,sgn] of[[m.string.sU,1],[m.string.sD,-1]]){const dz=pull+.2,len=Math.hypot(.98,dz);sg.scale.y=len;sg.position.set(0,sgn*.49,-.2+dz/2);sg.rotation.x=sgn*Math.atan2(dz,.98)*-1;}
  m.cup.visible=sit;if(sit&&Math.random()<dt*8)part(V(P.pos.x+rand(-.6,.6),GY+rand(.2,1.2),P.pos.z+rand(-.6,.6)),V(0,1.2,0),'#8fd0ff',.1,.8,0,'g');
  if(P.hawk>0&&Math.random()<dt*2.5)part(V(P.pos.x+rand(-.5,.5),GY+rand(.6,2.4),P.pos.z+rand(-.5,.5)),V(0,1,0),'#ffb05a',.06,.6,0,'g');
  for(const x of m.mats)x.emissive.setHex(P.flash>0?0x441111:0);
}
function animPet(dt,t){
  const g=pet.m;g.root.position.set(pet.pos.x,GY,pet.pos.z);g.root.rotation.y=lerpAng(g.root.rotation.y,pet.face,Math.min(1,dt*10));
  if(pet.moving)pet.walk+=dt*14;legs(g.legs,pet.walk,pet.moving?.9:0);
  const k=pet.anim>0?Math.sin((1-pet.anim/.4)*Math.PI):0;g.legs[0].rotation.x-=1.6*k;g.body.rotation.x=-.2*k;g.head.rotation.x=-.3*k;
  g.body.position.y=pet.moving?Math.abs(Math.sin(pet.walk))*.1:Math.sin(t*2.2)*.02;g.tail.rotation.y=Math.sin(t*3)*.4;
  const s=pet.bw>0?1.18:1;g.root.scale.setScalar(damp(g.root.scale.x,s,6,dt));
  g.bw.material.opacity=pet.bw>0?.14+.08*Math.sin(t*12):0;if(pet.bw>0&&Math.random()<dt*14)part(V(pet.pos.x+rand(-.5,.5),GY+rand(.6,1.8),pet.pos.z+rand(-.7,.7)),V(0,1.5,0),'#ff3a2a',.08,.4,0,'g');
  for(const x of g.mats)x.emissive.setHex(pet.flash>0?0x441111:0);
  petHp.style.width=pet.hp/PET_HP*100+'%';
}
function animate(dt,t){
  animP(dt,t);animPet(dt,t);
  for(const m of mobs){animMob(m,dt,t);if(m.marked>0&&Math.random()<dt*5)part(V(m.pos.x,GY+m.top+.6,m.pos.z),V(0,.4,0),'#ff5a4a',.12,.5,0,'g');}
  showCP(null,0,t);
  waves(t);leafTick(dt,t);
  mwWater.material.color.setRGB(.5+Math.sin(t*2)*.08,1.1,1.4);mwBeam.material.opacity=.1+Math.sin(t*1.5)*.04;mwBeam.rotation.y+=dt*.3;
  if(Math.random()<dt*4)part(V(MW.x+rand(-1.4,1.4),GY+.8,MW.z+rand(-1.4,1.4)),V(0,rand(1.5,3),0),'#bff4ff',.08,1.4,0,'g');
  for(const w of wisps){w.a+=w.sp*dt;w.o.position.set(Math.cos(w.a)*w.r,GY+w.h+Math.sin(t*1.4+w.ph)*.5,Math.sin(w.a)*w.r);
    if(Math.random()<dt*10)part(w.o.position.clone(),V(0,.3,0),'#bff4ff',.08,.6,0,'g');}
  lanterns.forEach((l,i)=>l.scale.set(.3,.36,.3).multiplyScalar(1+Math.sin(t*3+i)*.08));
}
function camFocus(){const tgt=V(P.pos.x,1,P.pos.z);const T=P.target&&!P.target.dead?P.target:alive()[0];if(T)tgt.lerp(V(T.pos.x,1,T.pos.z),P.combat?.45:.25);return tgt;}


/* ---------- loop */
let last=performance.now(),acc=0,time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  acc+=dt;while(acc>=1/60){tick(1/60);acc-=1/60;}time+=dt;
  animate(dt,time);updateParts(dt);updFx(dt);updShots(dt);updCallouts(dt);updNums(dt);updFlash(dt);updCastBar();updFrame();
  const tgt=camFocus();const nt=controls.target.clone().lerp(tgt,Math.min(1,dt*2));camera.position.add(nt.clone().sub(controls.target));controls.target.copy(nt);
  controls.update();
  shake=Math.max(0,shake-dt*.9);const o=V(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(shake*.6);
  camera.position.add(o);composer.render();camera.position.sub(o);}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

</script>
