<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const lerp=(a,b,t)=>a+(b-a)*t;

const lerpAng=(a,b,t)=>{const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;};
const damp=(c,t,k,dt)=>c+(t-c)*Math.min(1,k*dt);

/* ---------- renderer, camera, light, post */
const renderer=new THREE.WebGLRenderer({antialias:true});

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,400);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=1.3;controls.minDistance=10;controls.maxDistance=70;

const sun=new THREE.DirectionalLight(0xd8dccc,1.4);sun.position.set(-25,45,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;

/* ---------- materials + voxel helpers */
const box=new THREE.BoxGeometry(1,1,1);
const ML={};const lam=c=>ML[c]||(ML[c]=new THREE.MeshLambertMaterial({color:c}));

const MG={};const glow=c=>MG[c]||(MG[c]=new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(3)}));

function B(p,sx,sy,sz,c,x,y,z,mat){const o=new THREE.Mesh(box,mat?mat(c):lam(c));o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;}
function G(p,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g;}
const ringGeo=new THREE.RingGeometry(.86,1,48).rotateX(-Math.PI/2);
const cylGeo=new THREE.CylinderGeometry(1,1,1,24,1,true);

/* ---------- Tirisfal island: dead olive grass, dirt patches, graveyard + pumpkin patch */
const ISLAND=27,GY=1,PLAY=16;
const hmap=new Map();const key=(x,z)=>x+','+z;
const hillAt=(x,z)=>{const r=Math.hypot(x,z);if(r<19||r>ISLAND-2.6)return 0;
  const n=Math.sin(x*.4+2)*Math.cos(z*.36)+Math.sin((x-z)*.2)*.6;return n>.85?2:n>.25?1:0;};
{
  const cols=[];
  for(let x=-ISLAND;x<=ISLAND;x++)for(let z=-ISLAND;z<=ISLAND;z++){const r=Math.hypot(x,z);if(r>ISLAND)continue;
    const shore=r>ISLAND-2.6,h=shore?-.3:hillAt(x,z);hmap.set(key(x,z),h);cols.push([x,z,h,shore]);}
  const mesh=new THREE.InstancedMesh(box,new THREE.MeshLambertMaterial(),cols.length);
  const m=new THREE.Matrix4(),c=new THREE.Color();
  cols.forEach(([x,z,h,shore],i)=>{const hg=2+h;m.makeScale(1,hg,1).setPosition(x,GY+h-hg/2,z);mesh.setMatrixAt(i,m);
    const dirt=Math.sin(x*.3)*Math.cos(z*.27)>.55;
    if(shore)c.setHSL(.1,.14,.36+rand(-.03,.03));
    else if(dirt)c.setHSL(.07,.2,.3+rand(-.03,.03));
    else c.setHSL(.19+rand(-.02,.02),.24,.36+h*.03+rand(-.035,.035));
    mesh.setColorAt(i,c);});
  mesh.receiveShadow=true;mesh.castShadow=true;scene.add(mesh);
}
const groundAt=(x,z)=>GY+(hmap.get(key(Math.round(x),Math.round(z)))??0);
const PROPS=[];const prop=(x,y,z,sx,sy,sz,c)=>PROPS.push([x,y,z,sx,sy,sz,c]);
function deadTree(x,z){const y=groundAt(x,z),T='#5a4d44',T2='#4d4139';
  for(let k=0;k<6;k++)prop(x+(k>3?(k-3)*.25:0),y+.5+k,z,.8-k*.06,1,.8-k*.06,k%2?T:T2);
  for(const [dx,dz,h] of[[1,0,3.5],[-1,.3,4.6],[0,-1,5.3],[.6,.8,5.8]])for(let s=1;s<=3;s++)prop(x+dx*s*.55,y+h+s*.45,z+dz*s*.55,.32,.32,.32,T);
  if(Math.random()<.5)for(let k=0;k<6;k++)prop(x+rand(-1.6,1.6),y+rand(5,7),z+rand(-1.6,1.6),.5,.5,.5,pick(['#b5872e','#8f6a25','#a3772a']));}
for(let i=0;i<11;i++){const a=i/11*Math.PI*2+rand(-.2,.2),r=rand(19.5,23.5);deadTree(Math.cos(a)*r,Math.sin(a)*r);}
for(let i=0;i<3;i++){const a=rand(0,6.3),r=rand(9,15);deadTree(Math.cos(a)*r,Math.sin(a)*r);}
{const ga=.9;for(let k=0;k<9;k++){const a=ga+(k%3-1)*.12,r=18+Math.floor(k/3)*1.4,x=Math.cos(a)*r,z=Math.sin(a)*r,y=groundAt(x,z);   // graveyard
  prop(x,y+.45,z,.7,.9,.22,'#7d8088');prop(x,y+.95,z,.2,.3,.22,'#7d8088');prop(x,y+.03,z+.6,.6,.06,1,'#4a3a2e');}}
{const pa=3.6;for(let k=0;k<14;k++){const a=pa+rand(-.25,.25),r=rand(16,19),x=Math.cos(a)*r,z=Math.sin(a)*r,y=groundAt(x,z),s=rand(.45,.7);  // pumpkins
  prop(x,y+s/2,z,s,s*.8,s,pick(['#d9762b','#c4661f','#e08a35']));prop(x,y+s*.85,z,.08,.18,.08,'#4f6b2e');}}
for(let i=0;i<14;i++){const a=rand(0,6.3),r=rand(17,21),x=Math.cos(a)*r,z=Math.sin(a)*r,y=groundAt(x,z);prop(x,y+.45,z,.18,.9,.18,'#3d332d');}   // broken fence posts
for(let i=0;i<70;i++){const a=rand(0,6.3),r=Math.sqrt(Math.random())*18;prop(Math.cos(a)*r,GY+.15,Math.sin(a)*r,.1,.3,.1,pick(['#6b6a3a','#5a5a34','#7a6f40']));}   // dry tufts
{
  const mesh=new THREE.InstancedMesh(box,new THREE.MeshLambertMaterial(),PROPS.length);
  const m=new THREE.Matrix4(),c=new THREE.Color();
  PROPS.forEach(([x,y,z,sx,sy,sz,col],i)=>{m.makeScale(sx,sy,sz).setPosition(x,y,z);mesh.setMatrixAt(i,m);mesh.setColorAt(i,c.set(col));});
  mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);
}
const lamps=[];for(const a of[.3,2.4,4.6]){const x=Math.cos(a)*17,z=Math.sin(a)*17,g=G(scene,x,groundAt(x,z),z);   // Brill-style iron lamps
  B(g,.24,2.6,.24,'#2a2a2e',0,1.3,0);B(g,.8,.12,.12,'#2a2a2e',.3,2.5,0);B(g,.4,.4,.4,'#2a2a2e',.6,2.2,0);
  const l=B(g,.26,.26,.26,'#c8ff6a',.6,2.2,0,glow);l.castShadow=false;lamps.push(l);}
const wgeo=new THREE.PlaneGeometry(260,260,90,90);wgeo.rotateX(-Math.PI/2);
const water=new THREE.Mesh(wgeo,new THREE.MeshLambertMaterial({color:0x3c5248,flatShading:true}));water.position.y=.35;water.receiveShadow=true;scene.add(water);
const wpos=wgeo.attributes.position,wbase=Float32Array.from(wpos.array);
function waves(t){for(let i=0;i<wpos.count;i++){const x=wbase[i*3],z=wbase[i*3+2];wpos.array[i*3+1]=Math.sin(x*.3+t*.7)*.08+Math.cos(z*.28+t*.5)*.08;}wpos.needsUpdate=true;}
const mistMat=new THREE.MeshBasicMaterial({color:0xc8d0cc,transparent:true,opacity:.07,depthWrite:false});
const mist=[];for(let i=0;i<40;i++){const o=new THREE.Mesh(box,mistMat);o.scale.set(rand(3,6),rand(.4,.9),rand(3,6));const a=rand(0,6.3),r=rand(0,30);
  o.position.set(Math.cos(a)*r,GY+rand(.3,1.4),Math.sin(a)*r);scene.add(o);mist.push({o,v:rand(.2,.5)});}
const clouds=[];for(let i=0;i<8;i++){const g=G(scene,rand(-100,100),rand(22,28),rand(-70,30));
  for(let k=0,n=ri(7,11);k<n;k++)B(g,rand(3,5),rand(1.4,2.2),rand(2.5,4),'#9aa3a0',rand(-5,5),rand(-.5,.8),rand(-2,2)).castShadow=false;clouds.push({g,v:rand(.4,.9)});}

/* ---------- models */
function ms(){const c={},list=[];const f=k=>c[k]||(list.push(c[k]=new THREE.MeshLambertMaterial({color:k})),c[k]);f.list=list;return f;}
function warlockModel(){
  const mt=ms(),root=new THREE.Group(),body=G(root);
  const SK='#9aa59a',R='#4a2a6a',R2='#2a1838',BN='#bfb59c';
  const legs=[G(body,.2,.95,0),G(body,-.2,.95,0)];
  for(const l of legs){B(l,.26,.62,.28,'#2a1a30',0,-.3,0,mt);B(l,.3,.26,.4,'#1e1622',0,-.8,.04,mt);}
  B(body,.84,.82,.5,R,0,1.34,0,mt);B(body,.92,.62,.58,R,0,.78,0,mt);B(body,.94,.1,.6,R2,0,.5,0,mt);
  B(body,.18,1.2,.04,R2,0,1.05,.3,mt);B(body,.9,.12,.56,'#1a1020',0,1.0,0,mt);B(body,.14,.14,.06,'#b56cff',0,1.0,.3,glow);
  B(body,.52,.52,.52,SK,0,2.0,0,mt);B(body,.38,.14,.1,BN,0,1.78,.24,mt);
  B(body,.1,.07,.04,'#ffe95a',.12,2.04,.265,glow);B(body,.1,.07,.04,'#ffe95a',-.12,2.04,.265,glow);
  B(body,.64,.3,.64,R,0,2.3,-.02,mt);B(body,.64,.62,.12,R,0,2.0,-.3,mt);B(body,.12,.62,.62,R,.32,2.0,-.02,mt);B(body,.12,.62,.62,R,-.32,2.0,-.02,mt);
  for(const s of[1,-1]){B(body,.42,.36,.5,BN,s*.58,1.74,0,mt);B(body,.1,.08,.04,'#1a1a1a',s*.5,1.76,.25,mt);B(body,.1,.08,.04,'#1a1a1a',s*.66,1.76,.25,mt);}
  const armL=G(body,.56,1.6,0),armR=G(body,-.56,1.6,0);
  for(const a of[armL,armR]){B(a,.28,.62,.3,R,0,-.28,0,mt);B(a,.32,.14,.34,R2,0,-.56,0,mt);B(a,.18,.16,.18,SK,0,-.7,0,mt);}
  const staff=G(armR,0,-.7,0);B(staff,.1,2.2,.1,'#3a2a1a',0,-.4,0,mt);B(staff,.2,.12,.2,'#6a6a72',0,-1.45,0,mt);
  const gem=B(staff,.22,.32,.22,'#b56cff',0,-1.65,0,glow);gem.castShadow=false;
  const cup=B(armL,.16,.2,.16,'#c8a070',0,-.82,.06,mt);cup.visible=false;
  const hand=G(armL,0,-.8,0);
  return {root,body,legs,armL,armR,staff,gem,cup,hand,mats:mt.list};
}
function voidwalkerModel(){
  const mt=ms(),root=new THREE.Group(),body=G(root,0,1.1,0);
  const P='#4b3c9e',P2='#3a2e80',P3='#6a5ac8';
  B(body,1.1,1,.8,P,0,.5,0,mt);B(body,.8,.6,.06,P3,0,.6,.42,mt);
  B(body,.8,.42,.62,P,0,-.18,0,mt);B(body,.56,.4,.46,P2,0,-.55,0,mt);B(body,.32,.38,.3,P2,0,-.9,0,mt);
  const head=G(body,0,1.25,.05);B(head,.6,.55,.55,P,0,0,0,mt);
  B(head,.12,.08,.04,'#e0f0ff',.13,.04,.28,glow);B(head,.12,.08,.04,'#e0f0ff',-.13,.04,.28,glow);
  for(const s of[1,-1])B(body,.36,.24,.5,P3,s*.62,1.02,0,mt);
  const armL=G(body,.75,.85,0),armR=G(body,-.75,.85,0);
  for(const a of[armL,armR]){B(a,.4,.9,.45,P,0,-.42,0,mt);B(a,.46,.18,.5,'#d9a93a',0,-.72,0,mt);B(a,.5,.4,.52,P2,0,-1.0,0,mt);}
  return {root,body,head,armL,armR,mats:mt.list};
}
function ghoulModel(v){
  const mt=ms(),root=new THREE.Group(),body=G(root);
  const SK=v?'#7a8a62':'#86946e',RG='#4f4436',BN='#d8d0bc';
  const legs=[G(body,.2,.85,0),G(body,-.2,.85,0)];
  for(const l of legs){B(l,.26,.6,.28,RG,0,-.28,0,mt);B(l,.28,.2,.38,SK,0,-.74,.05,mt);}
  const torso=G(body,0,.9,0);
  B(torso,.78,.74,.48,RG,0,.38,0,mt);B(torso,.34,.34,.06,BN,.14,.46,.25,mt);B(torso,.06,.34,.07,'#3a3028',.14,.46,.27,mt);
  B(torso,.3,.3,.04,SK,-.2,.2,.25,mt);B(torso,.8,.1,.5,'#3a3028',0,.02,0,mt);
  const head=G(torso,0,.98,.12);B(head,.5,.5,.5,SK,0,0,0,mt);B(head,.36,.14,.14,BN,0,-.3,.12,mt);
  B(head,.09,.07,.04,'#ffe95a',.12,.06,.255,glow);B(head,.09,.07,.04,'#ffe95a',-.12,.06,.255,glow);
  B(head,.2,.12,.2,'#2a2a2a',.12,.28,-.05,mt);
  const armL=G(torso,.5,.7,0),armR=G(torso,-.5,.7,0);
  for(const a of[armL,armR]){B(a,.2,.62,.22,SK,0,-.3,0,mt);B(a,.22,.16,.22,SK,0,-.68,0,mt);B(a,.24,.2,.24,RG,0,-.08,0,mt);}
  return {root,body,torso,head,legs,armL,armR,mats:mt.list};

/* ---------- particles, effects, events */
const parts=[];
function part(pos,vel,color,size,life,grav=0,mode='b'){
  const o=new THREE.Mesh(box,mode==='s'?lam(color):mode==='g'?glow(color):bas(color));o.position.copy(pos);
  const s=size.isVector3?size.clone():V(size,size,size);o.scale.copy(s);o.castShadow=mode==='s';scene.add(o);
  parts.push({o,vel,life,max:life,s,grav,solid:mode==='s'});
}
const glowBurst=(p,c,n=12,s=4)=>{for(let i=0;i<n;i++)part(p,V(rand(-s,s),rand(0,s),rand(-s,s)),c,rand(.1,.2),rand(.35,.6),-6,'g');};
const burst=(p,c,n=8)=>{for(let i=0;i<n;i++)part(p,V(rand(-3,3),rand(0,4),rand(-3,3)),c,.15,.45,-8);};
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
  if(p.life<=0){scene.remove(p.o);parts.splice(i,1);continue;}

/* ---------- AI: the rotation */
function lockAI(dt){
  if(L.cast){const t=L.cast.target;if(t&&!t.dead)face(L,t.pos);return;}
  if(L.chan){if(L.chan.target)face(L,L.chan.target.pos);
    if(L.chan.id==='dl'&&L.chan.target.hp<L.chan.target.max*.25)L.chan=null;
    else if(L.chan.id==='hf'&&(VW.hp>=VW_HP*.97||L.combat))L.chan=null;   // switch to Drain Soul for the finish
    return;}
  if(L.sit>0)return;
  const eng=mobs.filter(m=>!m.dead&&m.engaged);
  if(eng.length){
    if(L.gcd>0)return;
    const attacker=eng.find(m=>m.target==='lock'&&d2(m.pos,L.pos)<3.5);
    if(L.hp<L_HP*.3&&attacker&&ready('coil')){use('coil',attacker);return;}
    if(L.mp<L_MP*.15&&L.hp>L_HP*.55&&ready('tap')){use('tap');return;}
    for(const m of eng)if(m.hp<m.max*.25&&ready('ds')){use('ds',m);return;}
    for(const m of eng){if(m.dots.corr<=0&&ready('corr')){use('corr',m);return;}if(m.dots.coa<=0&&ready('coa')){use('coa',m);return;}}
    for(const m of eng)if(m.dots.imm<=0&&m.hp>m.max*.35&&ready('imm')){use('imm',m);return;}
    if(attacker&&ready('dl')){use('dl',attacker);return;}
    const t=eng.slice().sort((a,b)=>a.hp-b.hp)[0];if(ready('sb'))use('sb',t);
    return;
  }
  if(L.gcd>0)return;
  if(L.armor<=0&&ready('armor')){use('armor');return;}
  if(!VW.alive&&ready('summon')){use('summon');return;}
  if(VW.alive&&VW.hp<VW_HP*.6&&L.hp>L_HP*.5&&ready('hf')){use('hf',VW);return;}
  if(L.mp<L_MP*.6&&L.hp>L_HP*.6&&ready('tap')){use('tap');return;}
  if(L.hp<L_HP*.7||L.mp<L_MP*.6){L.sit=7;callout(L,'Eat & Drink','#8fd0ff');return;}
  const alive=mobs.filter(m=>!m.dead);if(!alive.length||alive.some(m=>m.pop<1))return;
  const t=alive[0],d=d2(L.pos,t.pos);
  if(d>19){step(L,t.pos,6.5,dt,18.5);return;}
  face(L,t.pos);
  if(VW.alive&&!VW.target)VW.target=t;   // send the pet in
  if(d2(VW.pos,t.pos)<9&&ready('corr'))use('corr',t);
}

/* ---------- tick */
function tick(dt){

  L.mp=Math.min(L_MP,L.mp+dt*6);
  for(let i=later.length-1;i>=0;i--){later[i].t-=dt;if(later[i].t<=0){const f=later[i].fn;later.splice(i,1);f();}}
  L.combat=mobs.some(m=>!m.dead&&m.engaged);
  if(L.sit>0){L.sit-=dt;L.mp=Math.min(L_MP,L.mp+L_MP*.17*dt);L.hp=Math.min(L_HP,L.hp+L_HP*.14*dt);
    if((L.mp>=L_MP*.98&&L.hp>=L_HP*.98)||L.combat)L.sit=0;}
  lockAI(dt);
  if(L.cast){L.cast.t+=dt;if(Math.random()<dt*25)part(handPos().add(V(rand(-.3,.3),rand(-.3,.3),rand(-.3,.3))),V(0,1,0),'#b56cff',.1,.4,0,'g');
    if(L.cast.t>=AB[L.cast.id].cast){const c=L.cast;L.cast=null;if(!(c.target&&c.target.dead))FX[c.id](c.target);}}
  if(L.chan){const c=L.chan;c.t+=dt;c.tick-=dt;
    if(c.tick<=0){c.tick=1;const t=c.target;
      if(c.id==='dl'){hurtMob(t,ri(58,66));healL(60);num(L,'+60','heal');}
      else if(c.id==='ds')hurtMob(t,ri(68,76));
      else if(c.id==='hf'){VW.hp=Math.min(VW_HP,VW.hp+250);L.hp=Math.max(1,L.hp-100);num(VW,'+250','heal');}}
    if(L.chan&&L.chan.t>=AB[L.chan.id].chan)L.chan=null;}
  vwAI(dt);for(const m of mobs)mobAI(m,dt);updOrbs(dt);
}

/* ---------- animate */
function legs(ls,phase,amt){ls.forEach((l,i)=>l.rotation.x=Math.sin(phase+(i===1||i===2?Math.PI:0))*amt);}
function animL(dt,t){
  const m=L.m;m.root.position.set(L.pos.x,GY,L.pos.z);m.root.rotation.y=lerpAng(m.root.rotation.y,L.face,Math.min(1,dt*12));
  if(L.moving)L.walk+=dt*10;
  const sit=L.sit>0;
  if(sit)for(const l of m.legs)l.rotation.x=damp(l.rotation.x,-1.45,10,dt);else legs(m.legs,L.walk,L.moving?.7:0);
  m.body.position.y=damp(m.body.position.y,sit?-.62:L.moving?Math.abs(Math.sin(L.walk))*.07:Math.sin(t*2)*.015,14,dt);
  let ar=-.25,wr=-2.9,al=L.moving?-Math.sin(L.walk)*.5:0;
  if(sit){ar=-.6;wr=-2.4;al=-1.3;}
  else if(L.chan){al=-1.45;ar=-.9;wr=-2.2;}
  else if(L.cast){al=-1.6;ar=-.5;wr=-2.7;}
  else if(L.combat){al=-.6;}
  m.armR.rotation.x=damp(m.armR.rotation.x,ar,12,dt);m.armL.rotation.x=damp(m.armL.rotation.x,al,12,dt);m.staff.rotation.x=damp(m.staff.rotation.x,wr,12,dt);
  m.gem.scale.setScalar(.22*(1+Math.sin(t*4)*.12));m.cup.visible=sit;
  if(L.armor>0&&Math.random()<dt*4)part(V(L.pos.x+rand(-.5,.5),GY+rand(.2,2),L.pos.z+rand(-.5,.5)),V(0,.6,0),'#9a5cff',.07,.7,0,'g');
  if(sit&&Math.random()<dt*8)part(V(L.pos.x+rand(-.6,.6),GY+rand(.2,1.2),L.pos.z+rand(-.6,.6)),V(0,1.2,0),'#8fd0ff',.1,.8,0,'g');
  for(const x of m.mats)x.emissive.setHex(L.flash>0?0x441111:0);
  // drain beam + flowing motes
  if(L.chan&&L.chan.target&&!L.chan.target.dead){const a=handPos(),b=aimOf(L.chan.target),len=a.distanceTo(b);
    drain.visible=true;drain.material=beamMats[L.chan.id];drain.position.copy(a).lerp(b,.5);drain.lookAt(b);const w=.05+Math.sin(t*20)*.015;drain.scale.set(w,w,len);
    if(Math.random()<dt*40){const id=L.chan.id,c=id==='dl'?'#ff5a6a':id==='hf'?'#8aff6a':'#c69bff',[from,to]=id==='hf'?[a,b]:[b,a];part(from.clone().add(V(rand(-.3,.3),rand(-.3,.3),rand(-.3,.3))),to.clone().sub(from).multiplyScalar(1.8),c,.13,.5,0,'g');}}
  else drain.visible=false;
}
function animVW(dt,t){
  if(!VW.alive)return;const m=VW.m;m.root.position.set(VW.pos.x,GY,VW.pos.z);m.root.rotation.y=lerpAng(m.root.rotation.y,VW.face,Math.min(1,dt*10));
  m.root.scale.setScalar(VW.pop<1?ease(VW.pop):1);m.body.position.y=1.1+Math.sin(t*2)*.12;
  const k=VW.lunge>0?Math.sin((1-VW.lunge/.35)*Math.PI):0;m.armR.rotation.x=damp(m.armR.rotation.x,VW.target?-.6-k*1.4:0,14,dt);m.armL.rotation.x=damp(m.armL.rotation.x,VW.target?-.4:0,10,dt);
  m.body.rotation.x=VW.moving?.25:0;
  if(Math.random()<dt*10)part(V(VW.pos.x+rand(-.25,.25),GY+.2,VW.pos.z+rand(-.25,.25)),V(0,-.2,0),'#6a5ac8',.14,.5,0,'g');
  for(const x of m.mats)x.emissive.setHex(VW.flash>0?0x441111:0x120a30);
}
function animMob(m,dt,t){
  const g=m.m;g.root.position.set(m.pos.x,GY,m.pos.z);g.root.rotation.y=lerpAng(g.root.rotation.y,m.face,Math.min(1,dt*8));
  const s=m.pop<1?m.pop*(1+Math.sin(m.pop*Math.PI)*.2):1,sq=m.knock>0?Math.sin(m.knock/.14*Math.PI)*.1:0;
  g.root.scale.set(s*(1+sq*.5),s*(1-sq),s*(1+sq*.5));
  if(m.moving)m.walk+=dt*(m.engaged?8:4);legs(g.legs,m.walk,m.moving?.55:0);
  const reach=m.engaged?-1.35:-.2,k=m.lunge>0?Math.sin((1-m.lunge/.4)*Math.PI):0;
  g.armR.rotation.x=damp(g.armR.rotation.x,reach-k*1.1+(m.moving?Math.sin(m.walk)*.2:0),12,dt);g.armL.rotation.x=damp(g.armL.rotation.x,reach-k*.8-(m.moving?Math.sin(m.walk)*.2:0),12,dt);
  g.torso.rotation.x=.25+k*.2;g.torso.rotation.z=Math.sin(m.walk*.5)*.12;g.head.rotation.z=Math.sin(t*1.3+m.i)*.15;g.body.position.z=-sq*1.5;
  for(const x of g.mats)x.emissive.setHex(m.flash>0?0x662222:0);
  if(m.pop>=1){const [x,y,behind]=scr(V(m.pos.x,GY+m.top+.45,m.pos.z));m.plate.style.display=behind?'none':'block';
    m.plate.style.transform=`translate(${x-39}px,${y}px)`;m.plate.children[1].firstChild.style.width=Math.max(0,m.hp/m.max*100)+'%';
    const dk=['corr','coa','imm','sl'].filter(id=>m.dots[id]>0).join();if(dk!==m.dk){m.dk=dk;m.plate.lastChild.innerHTML=dk?dk.split(',').map(id=>`<s style="background:${DOT[id].c}"></s>`).join(''):'';}}
}
function animate(dt,t){
  animL(dt,t);animVW(dt,t);for(const m of mobs)if(!m.dead)animMob(m,dt,t);
  updCallouts(dt);
  if(FL){FL.t+=dt;const k=FL.t/FL.dur;fxLight.intensity=k<1?FL.peak*(1-k)*(1-k):0;if(k>=1)FL=null;}
  waves(t);lamps.forEach((l,i)=>l.scale.setScalar(.26*(1+Math.sin(t*6+i*2)*.1)));
  for(const m of mist){m.o.position.x+=m.v*dt;if(m.o.position.x>32)m.o.position.x=-32;}
  for(const c of clouds){c.g.position.x+=c.v*dt;if(c.g.position.x>120)c.g.position.x=-120;}
  for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.t+=dt;if(n.t>n.life){n.el.remove();nums.splice(i,1);continue;}
    n.p.y+=dt*1.5;const [x,y]=scr(n.p);const pop=n.t<.1?1+(.1-n.t)*4:1;
    n.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${pop})`;n.el.style.opacity=1-Math.pow(n.t/n.life,2);}
  const busy=L.cast||L.chan||L.sit>0;
  if(busy){let name,k,ch;
    if(L.cast){name=AB[L.cast.id].n;k=L.cast.t/AB[L.cast.id].cast;ch=false;}
    else if(L.chan){name=AB[L.chan.id].n;k=1-L.chan.t/AB[L.chan.id].chan;ch=true;}
    else{name='Eat & Drink';k=1-L.sit/7;ch=true;}
    cb.style.display='block';cb.className='cb'+(ch?' ch':'');const [x,y]=scr(V(L.pos.x,GY+L.top+.4,L.pos.z));
    cb.style.transform=`translate(${x-65}px,${y-30}px)`;cb.firstChild.textContent=name;cb.querySelector('i').style.width=Math.min(100,k*100)+'%';}
  else cb.style.display='none';
  ufHp.style.width=L.hp/L_HP*100+'%';ufHpT.textContent=`${Math.round(L.hp)} / ${L_HP}`;
  ufMp.style.width=Math.max(0,L.mp)/L_MP*100+'%';ufMpT.textContent=`${Math.round(Math.max(0,L.mp))} / ${L_MP}`;
  petHp.style.width=(VW.alive?VW.hp/VW_HP*100:0)+'%';
  const bf=[];if(L.armor>0)bf.push(['Demon Armor','#c69bff']);if(L.shards)bf.push([`Soul Shards ×${L.shards}`,'#e0b8ff']);if(L.sit>0)bf.push(['Food & Drink','#8fd0ff']);
  const k=bf.map(b=>b[0]).join();if(k!==buffsKey){buffsKey=k;buffsEl.innerHTML=bf.map(([n,c])=>`<em style="color:${c}">${n}</em>`).join('');}
}

/* ---------- loop */
let last=performance.now(),acc=0,time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  acc+=dt;while(acc>=1/60){tick(1/60);acc-=1/60;}time+=dt;
  animate(dt,time);updateParts(dt);updFx(dt);
  const tgt=V(L.pos.x,1,L.pos.z),alive=mobs.filter(m=>!m.dead);
  if(alive.length){const c=V();alive.forEach(m=>c.add(m.pos));c.divideScalar(alive.length);c.y=1;tgt.lerp(c,L.combat?.4:.25);}
  const nt=controls.target.clone().lerp(tgt,Math.min(1,dt*2));camera.position.add(nt.clone().sub(controls.target));controls.target.copy(nt);
  controls.update();
  shake=Math.max(0,shake-dt*.9);const o=V(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(shake*.6);
  camera.position.add(o);composer.render();camera.position.sub(o);}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
