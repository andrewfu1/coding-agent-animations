<style>

.cb span{display:block;font:700 13px/1 "Cinzel",Georgia,serif;color:#fff;text-shadow:0 1px 2px #000;margin-bottom:3px}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-(1-t)*(1-t);
const lerpAng=(a,b,t)=>{const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;};
const damp=(c,t,k,dt)=>c+(t-c)*Math.min(1,k*dt);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- renderer, camera, light, post */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;
document.body.prepend(renderer.domElement);
const SKY=0xbfe0f4;
const scene=new THREE.Scene();scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,60,160);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,400);
camera.position.set(0,22,30);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=1.3;controls.minDistance=10;controls.maxDistance=70;
controls.target.set(0,1,0);controls.autoRotate=true;controls.autoRotateSpeed=.35;
scene.add(new THREE.HemisphereLight(0xf2fbff,0x7a8a4a,1.2));
const sun=new THREE.DirectionalLight(0xfff2d8,1.75);sun.position.set(35,40,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;
Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,far:140});
sun.shadow.camera.updateProjectionMatrix();scene.add(sun);
const fxLight=new THREE.PointLight(0x9fe8ff,0,16,1.5);scene.add(fxLight);   // reused for every spell flash
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio,2));
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.45,.86));
composer.addPass(new OutputPass());

/* ---------- materials + voxel helpers */
const box=new THREE.BoxGeometry(1,1,1);
const ML={};const lam=c=>ML[c]||(ML[c]=new THREE.MeshLambertMaterial({color:c}));
const MBc={};const bas=c=>MBc[c]||(MBc[c]=new THREE.MeshBasicMaterial({color:c}));
const MG={};const glow=c=>MG[c]||(MG[c]=new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(3)}));
const addMat=(c,o=1,side=THREE.FrontSide)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side});
function B(p,sx,sy,sz,c,x,y,z,mat){const o=new THREE.Mesh(box,mat?mat(c):lam(c));o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;}
function G(p,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g;}
const ringGeo=new THREE.RingGeometry(.86,1,48).rotateX(-Math.PI/2);
const cylGeo=new THREE.CylinderGeometry(1,1,1,24,1,true);
function ms(){const c={},list=[];const f=k=>c[k]||(list.push(c[k]=new THREE.MeshLambertMaterial({color:k})),c[k]);f.list=list;return f;}

/* ---------- particles, timed effects, scheduled events */
const parts=[];
function part(pos,vel,color,size,life,grav=0,mode='b'){
  const o=new THREE.Mesh(box,mode==='s'?lam(color):mode==='g'?glow(color):bas(color));o.position.copy(pos);
  const s=size.isVector3?size.clone():V(size,size,size);o.scale.copy(s);o.castShadow=mode==='s';scene.add(o);
  parts.push({o,vel,life,max:life,s,grav,solid:mode==='s'});
}
const burst=(p,c,n=8)=>{for(let i=0;i<n;i++)part(p,V(rand(-3,3),rand(0,4),rand(-3,3)),c,.15,.45,-8);};
const glowBurst=(p,c,n=12,s=4)=>{for(let i=0;i<n;i++)part(p,V(rand(-s,s),rand(0,s),rand(-s,s)),c,rand(.1,.2),rand(.35,.6),-6,'g');};
const motes=(p,c,n=14,r=1)=>{for(let i=0;i<n;i++){const a=rand(0,6.3),rr=rand(0,r);part(V(p.x+Math.cos(a)*rr,GY+rand(0,.6),p.z+Math.sin(a)*rr),V(0,rand(1.5,3.5),0),c,rand(.08,.15),rand(.7,1.2),0,'g');}};
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
  if(p.life<=0){scene.remove(p.o);parts.splice(i,1);continue;}
  p.vel.y+=p.grav*dt;p.o.position.addScaledVector(p.vel,dt);
  if(p.solid&&p.o.position.y<GY+p.s.y/2){p.o.position.y=GY+p.s.y/2;p.vel.multiplyScalar(.5);p.vel.y=Math.abs(p.vel.y)*.3;}
  p.o.scale.copy(p.s).multiplyScalar(p.solid?Math.min(1,p.life/.4):p.life/p.max);}}
const fx=[];
function addFx(o,dur,upd,own=true){scene.add(o);fx.push({o,t:0,dur,upd,own});upd(o,0);}
function updFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const k=f.t/f.dur;
  if(k>=1){scene.remove(f.o);if(f.own)f.o.material.dispose();fx.splice(i,1);continue;}f.upd(f.o,k);}}
function ring(p,c,r0,r1,dur=.6,o=.9){const m=new THREE.Mesh(ringGeo,addMat(c,o));m.position.set(p.x,GY+.06,p.z);
  addFx(m,dur,(m,k)=>{const r=lerp(r0,r1,ease(k));m.scale.set(r,1,r);m.material.opacity=o*(1-k);});}
function beam(p,c,r,h,dur=1,o=.5){const m=new THREE.Mesh(cylGeo,addMat(c,0,THREE.DoubleSide));m.position.set(p.x,GY+h/2,p.z);
  addFx(m,dur,(m,k)=>{m.material.opacity=Math.sin(k*Math.PI)*o;const s=r*(1-k*.35);m.scale.set(s,h,s);});}
function bolt(a,b,c='#bfe6ff',w=.09,dur=.2,jag=.55){   // jagged lightning: chain of glowing voxel segments
  const g=new THREE.Group();let prev=a.clone();const n=Math.max(4,Math.round(a.distanceTo(b)/1.2));
  for(let i=1;i<=n;i++){const p=a.clone().lerp(b,i/n);if(i<n)p.add(V(rand(-jag,jag),rand(-jag,jag),rand(-jag,jag)));
    const s=new THREE.Mesh(box,glow(c));s.scale.set(w,w,prev.distanceTo(p)+w);s.position.copy(prev).lerp(p,.5);s.lookAt(p);g.add(s);prev=p;}
  addFx(g,dur,(g,k)=>{g.visible=k<.4||Math.random()>.35;for(const s of g.children){s.scale.x=s.scale.y=w*(1-k*.7);}},false);}
let FL=null;const flash=(p,c,peak,dur)=>{fxLight.position.set(p.x,GY+2.2,p.z);fxLight.color.set(c);FL={t:0,dur,peak};};
let shake=0;const addShake=a=>shake=Math.max(shake,a);
const later=[];const after=(t,fn)=>later.push({t,fn});
const shots=[];   // small glowing projectiles (Searing Totem)
function shoot(from,target,c,onHit){const o=B(scene,.22,.22,.22,c,from.x,from.y,from.z,glow);o.castShadow=false;shots.push({o,target,c,onHit});}
function updShots(dt){for(let i=shots.length-1;i>=0;i--){const s=shots[i],T=s.target;
  if(T.dead){scene.remove(s.o);shots.splice(i,1);continue;}
  const tp=wpos2(T),dir=tp.sub(s.o.position);
  if(dir.length()<22*dt+.3){scene.remove(s.o);shots.splice(i,1);s.onHit();continue;}
  s.o.position.addScaledVector(dir.normalize(),22*dt);s.o.rotation.x+=dt*10;part(s.o.position.clone(),V(0,.5,0),s.c,.12,.3,0,'g');}}

/* ---------- screen-space UI */
const layer=document.getElementById('layer');
const pv=V();const scr=p=>{pv.copy(p).project(camera);return [(pv.x+1)/2*innerWidth,(1-pv.y)/2*innerHeight,pv.z>1];};
const callouts=[];
function callout(ent,text,color){
  for(const c of callouts)if(c.ent===ent)c.lift+=22;
  const el=document.createElement('div');el.className='ab';el.textContent=text;el.style.color=color;layer.appendChild(el);
  callouts.push({el,ent,t:0,lift:0});}
function updCallouts(dt){for(let i=callouts.length-1;i>=0;i--){const c=callouts[i];c.t+=dt;
  if(c.t>1.6){c.el.remove();callouts.splice(i,1);continue;}
  const [x,y]=scr(V(c.ent.pos.x,GY+c.ent.top+.9,c.ent.pos.z));
  const pop=c.t<.12?.6+c.t/.12*.5:c.t<.22?1.1-(c.t-.12)/.1*.1:1;
  const up=c.lift+c.t*34+(c.t>1?(c.t-1)*40:0);
  c.el.style.transform=`translate(${x}px,${y-up}px) translate(-50%,-50%) scale(${pop})`;
  c.el.style.opacity=c.t<1?1:Math.max(0,1-(c.t-1)/.6);}}
const cb=document.createElement('div');cb.className='cb';cb.innerHTML='<span></span><b><i></i></b>';layer.appendChild(cb);
const nums=[];
function num(ent,text,cls=''){const el=document.createElement('div');el.className='n '+cls;el.textContent=text;layer.appendChild(el);
  nums.push({el,p:V(ent.pos.x+rand(-.6,.6),GY+ent.top-.2,ent.pos.z+rand(-.3,.3)),t:0,life:cls.includes('c')||cls==='alert'?1.3:1});}
function mkPlate(name){const el=document.createElement('div');el.className='plate';el.innerHTML=`<span>${name}</span><b><i></i></b>`;layer.appendChild(el);return el;}
const ufHp=document.querySelector('#uf .hp i'),ufHpT=document.querySelector('#uf .hp span'),ufMp=document.querySelector('#uf .mp i'),ufMpT=document.querySelector('#uf .mp span'),buffsEl=document.getElementById('buffs');
let buffsKey='';

/* ---------- shared kit: movement, mobs, mob animation, HUD */
function step(e,tp,speed,dt,stop=0){const dx=tp.x-e.pos.x,dz=tp.z-e.pos.z,d=Math.hypot(dx,dz);if(d<=stop)return;
  const s=Math.min(speed*dt,d-stop);e.pos.x+=dx/d*s;e.pos.z+=dz/d*s;e.face=Math.atan2(dx,dz);e.moving=true;
  const r=Math.hypot(e.pos.x,e.pos.z);if(r>PLAY){e.pos.x*=PLAY/r;e.pos.z*=PLAY/r;}}
const face=(e,p)=>e.face=Math.atan2(p.x-e.pos.x,p.z-e.pos.z);
function legs(ls,phase,amt){ls.forEach((l,i)=>l.rotation.x=Math.sin(phase+(i===1||i===2?Math.PI:0))*amt);}

const mobs=[];
const wpos2=m=>V(m.pos.x,GY+m.top*.48,m.pos.z);
const alive=()=>mobs.filter(m=>!m.dead);
function makeMob(p,def){
  const m={pos:p.clone(),home:p.clone(),wp:p.clone(),face:rand(0,6.3),m:def.model(),top:def.top,hp:def.hp,max:def.hp,walk:0,moving:false,wasMoving:false,
    engaged:false,atk:rand(.5,1.2),lunge:0,flash:0,knock:0,dead:false,pop:0,wait:rand(1,3),stun:0,fear:0,fearDir:0,slow:0,dots:{},def,target:null,plate:mkPlate(def.name)};
  m.m.root.scale.setScalar(.01);m.m.root.position.set(p.x,GY,p.z);scene.add(m.m.root);mobs.push(m);return m;}
function spawnPack(n,def,minD=20,spread=2.2){
  let c,tries=0;do{const a=Math.atan2(-P.pos.z,-P.pos.x)+rand(-1,1),r=rand(8,PLAY-2);c=V(Math.cos(a)*r,0,Math.sin(a)*r);}while(d2(c,P.pos)<minD&&++tries<80);
  const out=[];for(let i=0;i<n;i++){const a=i/n*6.28+rand(-.3,.3),s=n>1?spread:0;out.push(makeMob(V(c.x+Math.cos(a)*s,0,c.z+Math.sin(a)*s),def));}
  return out;}
function aggro(m,link=true){if(m.dead||m.engaged)return;m.engaged=true;num(m,'!','alert');
  if(link&&m.def.link)for(const o of mobs)if(o!==m&&!o.dead&&!o.engaged&&d2(o.pos,m.pos)<9)after(rand(.25,.6),()=>aggro(o,false));}
function hurtMob(m,amt,c=false,kind=''){
  if(!m||m.dead)return 0;amt=Math.round(amt*(c?2:1));m.hp-=amt;m.flash=.1;m.knock=.16;
  num(m,amt,kind+(c?' c':''));aggro(m);if(m.hp<=0)killMob(m);return amt;}
function shatter(root,mult=1){root.updateMatrixWorld(true);
  root.traverse(o=>{if(o.isMesh&&o.visible&&o.material&&o.material.color){const p=V(),s=V();o.getWorldPosition(p);o.getWorldScale(s);
    part(p,V(rand(-3,3)*mult,rand(3,7),rand(-3,3)*mult),'#'+o.material.color.getHexString(),s,rand(1.2,2),-20,'s');}});}
function killMob(m){
  m.dead=true;shatter(m.m.root);scene.remove(m.m.root);m.plate.remove();m.dots={};num(P,'+'+ri(m.def.xp[0],m.def.xp[1])+' XP','xp');
  if(typeof onMobDeath==='function')onMobDeath(m);
  const i=mobs.indexOf(m);if(i>=0)mobs.splice(i,1);
  if(P.cast&&P.cast.target===m)P.cast=null;
  if(!mobs.length)onClear();}
function mobAI(m,dt){
  m.pop=Math.min(1,m.pop+dt*1.5);m.flash-=dt;m.lunge-=dt;m.knock-=dt;m.stun-=dt;m.fear-=dt;m.slow-=dt;m.rooted-=dt;m.moving=false;
  for(const k in m.dots){const d=m.dots[k];d.t-=dt;d.tick-=dt;
    if(d.tick<=0){d.tick=d.every;hurtMob(m,ri(d.lo,d.hi),false,d.kind||'');if(m.dead)return;}
    if(d.fx&&Math.random()<dt*(d.rate||8))d.fx(m);if(d.t<=0)delete m.dots[k];}
  if(!(m.rooted>0))for(const o of mobs)if(o!==m&&!o.dead){const dd=d2(o.pos,m.pos);if(dd<1.7&&dd>.01){const k=(1.7-dd)*dt*3;m.pos.x+=(m.pos.x-o.pos.x)/dd*k;m.pos.z+=(m.pos.z-o.pos.z)/dd*k;}}
  if(!(m.rooted>0))for(const o of[P,typeof pet!=='undefined'?pet:null]){if(!o)continue;const gap=(m.def.sep||1.9)+(o.sep||0),dd=d2(o.pos,m.pos);
    if(dd<gap&&dd>.01){const k=Math.min(gap-dd,dt*8),q=o.moving?o:m,sg=q===m?1:-1;q.pos.x+=sg*(m.pos.x-o.pos.x)/dd*k;q.pos.z+=sg*(m.pos.z-o.pos.z)/dd*k;}}
  if(m.stun>0||m.pop<1){m.wasMoving=false;return;}
  if(!m.engaged){m.wait-=dt;if(m.wait<=0){m.wait=rand(3,6);m.wp=m.home.clone().add(V(rand(-2,2),0,rand(-2,2)));}step(m,m.wp,1.2,dt,.3);m.wasMoving=m.moving;return;}
  if(m.fear>0){if(Math.random()<dt*1.5)m.fearDir+=rand(-1.2,1.2);step(m,V(m.pos.x+Math.sin(m.fearDir)*3,0,m.pos.z+Math.cos(m.fearDir)*3),3.4,dt);m.wasMoving=m.moving;return;}

/* ---------- AI: the rotation */
function balanceAI(dt,eng){
  const near=eng.filter(m=>d2(m.pos,P.pos)<4.6),free=eng.filter(m=>!(m.rooted>0));
  const T=P.target=(free.length?free:eng).reduce((a,b)=>b.hp<a.hp?b:a);face(P,T.pos);
  if(P.form!=='moonkin'){if(P.hp<P_HP*.6&&P.rejuv<=0&&ready('rejuv')){use('rejuv');return;}if(ready('moonkin')){use('moonkin');return;}
    if(d2(P.pos,T.pos)>3.4)step(P,T.pos,6,dt,3);return;}
  if(P.gcd>0)return;
  if(P.mana<P_MP*.5&&ready('inn')){use('inn');return;}
  if(near.length>=2&&ready('hurr')){const c=V();near.forEach(m=>c.add(m.pos));c.multiplyScalar(1/near.length);use('hurr',c);return;}
  const far=eng.filter(m=>d2(m.pos,P.pos)>6.5&&!m.wasRooted).sort((a,b)=>d2(b.pos,P.pos)-d2(a.pos,P.pos))[0];
  if(eng.length>=2&&far&&ready('roots')){use('roots',far);return;}
  const mf=eng.filter(m=>m.dots.moonfire).length<2&&eng.find(m=>!m.dots.moonfire&&m.hp>350);   // Moonfire on up to two mobs, Insect Swarm on the kill target
  if(mf&&ready('moonfire')){use('moonfire',mf);return;}
  if(!T.dots.swarm&&T.hp>350&&ready('swarm')){use('swarm',T);return;}
  if(!near.length&&ready('starfire')){use('starfire',T);return;}
  if(ready('wrath')){use('wrath',T);return;}
  if(P.mana<AB.wrath.mana&&!P.cc&&d2(P.pos,T.pos)>3.4)step(P,T.pos,6,dt,3);   // out of mana: walk in and claw it out in Moonkin Form
}
function feralAI(dt,eng){
  const T=P.target=eng[0];const d=d2(P.pos,T.pos);face(P,T.pos);
  if(P.form==='caster'){if(P.hp<P_HP*.6&&P.rejuv<=0&&ready('rejuv')){use('rejuv');return;}if(ready('cat')){use('cat');return;}
    if(d>3.4)step(P,T.pos,6,dt,3);return;}
  if(d>3.4)step(P,T.pos,7,dt,3);
  if(P.gcd>0||d>3.8)return;
  if(behind(T)&&ready('shred')){use('shred',T);return;}
  if(!(T.ffd>0)&&ready('ff')){use('ff',T);return;}
  if(P.energy<=40&&ready('tf')&&P.cp<5){use('tf');return;}
  if(P.cp>=5){if(!T.dots.rip&&T.hp>T.max*.5){if(ready('rip'))use('rip',T);return;}if(ready('bite'))use('bite',T);return;}
  if(!T.dots.rake&&T.hp>T.max*.3&&ready('rake')){use('rake',T);return;}
  if(ready('claw'))use('claw',T);
}
function pAI(dt){
  if(P.cast){const t=P.cast.target;if(t&&!t.dead)face(P,t.pos);return;}
  if(P.drink>0||P.leap)return;
  const live=alive();
  if(P.combat){
    const eng=live.filter(m=>m.engaged);if(!eng.length)return;
    if(P.hp<P_HP*.42&&P.bark<=0&&ready('bark')){use('bark');return;}
    if(P.hp<P_HP*.33&&P.mana>=500&&P.gcd<=0){P.chan=null;if(P.form!=='caster'){shift('caster');callout(P,'Caster Form','#9be27a');return;}
      if(ready('regrowth')){use('regrowth');return;}}
    if(P.spec==='balance'&&eng.filter(m=>d2(m.pos,P.pos)<4.6).length>=2&&P.bark<=0&&ready('bark')){use('bark');return;}
    if(P.chan){face(P,P.chan.at);return;}
    (P.spec==='balance'?balanceAI:feralAI)(dt,eng);
    return;
  }
  P.chan=null;
  if(P.gcd>0)return;
  if(P.form!=='caster'&&(P.hp<P_HP*.7||P.mana<P_MP*.5||P.motw<=0||P.thorns<=0||P.spec!==P.want)){shift('caster');return;}
  if(P.form==='caster'){
    if(P.motw<=0&&ready('motw')){use('motw');return;}
    if(P.thorns<=0&&ready('thorns')){use('thorns');return;}
    if(P.hp<P_HP*.7&&P.mana>P_MP*.4&&ready('regrowth')){use('regrowth');return;}
    if(P.mana<P_MP*.5||P.hp<P_HP*.7){startDrink();return;}
    if(P.spec!==P.want){AB.spec.n=SPECS[P.want].name+' Spec';use('spec');return;}
  }
  const T=live.filter(m=>m.pop>=1)[0];if(!T)return;P.target=T;const d=d2(P.pos,T.pos);
  if(P.spec==='balance'){
    if(P.form!=='moonkin'){if(ready('moonkin'))use('moonkin');return;}
    if(d>14){step(P,T.pos,6,dt,13.6);return;}
    face(P,T.pos);if(ready('starfire'))use('starfire',T);return;}
  if(P.form==='caster'){if(ready('cat'))use('cat');return;}
  const sp=P.dash>0?1.7:1;
  if(d>17){step(P,T.pos,8*sp,dt,16);return;}
  if(!P.prowl){if(ready('prowl'))use('prowl');return;}
  if(d>9&&P.dash<=0&&ready('dash')){use('dash');return;}   // Dash while prowling
  const back=V(T.pos.x-Math.sin(T.face)*4.5,0,T.pos.z-Math.cos(T.face)*4.5);
  if(d2(P.pos,back)>.8&&d>3.6){step(P,d>8?T.pos:back,4.5*sp,dt,d>8?6:0);return;}
  face(P,T.pos);if(ready('pounce'))use('pounce',T);
}

/* ---------- tick (fixed 60 Hz) */
const CASTC={regrowth:'#9bff9a',starfire:'#ffd98a',wrath:'#9be27a',roots:'#6aa83a'};
function tick(dt){
  P.moving=false;
  P.gcd-=dt;for(const k in P.cd)P.cd[k]-=dt;P.flash-=dt;P.motw-=dt;P.thorns-=dt;P.tf-=dt;P.bark-=dt;P.inn-=dt;P.dash-=dt;
  for(const m of mobs)if(m.ffd>0)m.ffd-=dt;
  runLater(dt);
  P.energy=Math.min(100,P.energy+dt*14);P.mana=Math.min(P_MP,P.mana+dt*(P.combat?3:8)+(P.inn>0?75*dt:0));
  P.combat=alive().some(m=>m.engaged);
  if(!P.combat&&!P.prowl)P.cp=0;
  if(P.rejuv>0){const before=Math.floor(P.rejuv/3);P.rejuv-=dt;if(Math.floor(P.rejuv/3)<before&&P.rejuv>0){const h=ri(85,100);P.hp=Math.min(P_HP,P.hp+h);num(P,'+'+h,'heal');motes(P.pos,'#9be27a',6,.8);}}
  if(P.drink>0){P.drink-=dt;P.mana=Math.min(P_MP,P.mana+P_MP*.16*dt);P.hp=Math.min(P_HP,P.hp+P_HP*.12*dt);if((P.mana>=P_MP*.98&&P.hp>=P_HP*.98)||P.combat)P.drink=0;}
  if(P.leap){const L=P.leap,T=L.to;L.t+=dt;const k=Math.min(1,L.t/L.dur);
    if(!T.dead){const tp=V(T.pos.x-Math.sin(T.face)*2.9,0,T.pos.z-Math.cos(T.face)*2.9);P.pos.x=lerp(L.from.x,tp.x,ease(k));P.pos.z=lerp(L.from.z,tp.z,ease(k));face(P,T.pos);}
    if(k>=1){P.leap=null;if(!T.dead){hurtMob(T,ri(40,50));T.stun=3;addCP(1);addShake(.25);claws(T,'#ff9a3a',14);ring(T.pos,'#ff9a3a',.4,2.6,.45);flash(T.pos,0xff9a3a,30,.35);
      T.dots.pounce={t:18,tick:3,every:3,lo:30,hi:36,kind:'bleed',fx:m=>part(V(m.pos.x+rand(-.4,.4),GY+rand(.6,1.6),m.pos.z+rand(-.4,.4)),V(0,-1,0),'#c0180c',.1,.6,-6,'b')};}}}
  pAI(dt);
  if(P.cast){P.cast.t+=dt;const id=P.cast.id;
    if(id==='spec'){const c=SPECS[P.want].c;for(let i=0;i<2;i++){const a=P.cast.t*9+i*3.14+rand(-.3,.3),r=1.3-P.cast.t*.3;
      part(V(P.pos.x+Math.cos(a)*r,GY+.2+P.cast.t*1.1+rand(-.2,.2),P.pos.z+Math.sin(a)*r),V(-Math.sin(a)*2,1,Math.cos(a)*2),pick([c,'#ffffff']),.12,.6,0,'g');}}
    else if(Math.random()<dt*25)part(castPos().add(V(rand(-.3,.3),rand(-.3,.3),rand(-.3,.3))),V(0,1,0),CASTC[id]||'#9bff9a',.1,.4,0,'g');
    if(P.cast.t>=AB[id].cast){const c=P.cast;P.cast=null;if(!(c.target&&c.target.dead))FX[id](c.target);}}
  if(P.chan){const C=P.chan;C.t-=dt;C.tick-=dt;
    if(C.tick<=0){C.tick=1;const inside=alive().filter(m=>d2(m.pos,C.at)<4.8);
      for(const m of inside){hurtMob(m,ri(95,115),crit(.1),'nat');m.slow=1.3;}
      const m=pick(inside);if(m&&!m.dead){bolt(V(m.pos.x+rand(-1,1),GY+8.5,m.pos.z+rand(-1,1)),wpos2(m),'#dff6ff',.11,.22,.8);flash(m.pos,0xdff6ff,30,.25);}}
    if(C.t<=0||!alive().some(m=>d2(m.pos,C.at)<5.5))P.chan=null;}
  P.swing=Math.max(0,(P.swing||0)-dt);const T=P.target;
  if(P.combat&&P.form==='cat'&&!P.leap&&T&&!T.dead&&P.swing<=0&&d2(P.pos,T.pos)<=3.8){P.swing=1.6;if(!P.anim)anim('swipe',2.2);
    after(.1,()=>{if(T.dead)return;hurtMob(T,ri(78,92)*(P.tf>0?1.25:1),crit());claws(T,'#e8e8e8',3);
      if(!P.cc&&Math.random()<.16){P.cc=true;callout(P,'Clearcasting','#bfe6ff');ring(P.pos,'#bfe6ff',.4,2.2,.4);}});}
  const MT=alive().filter(m=>m.engaged&&d2(P.pos,m.pos)<=3.9)[0];
  if(P.combat&&P.form!=='cat'&&!P.cast&&!P.chan&&MT&&P.swing<=0){const mk=P.form==='moonkin';P.swing=mk?2.4:3;anim(mk?'swipe':'staff',1.4);
    after(.25,()=>{if(MT.dead)return;hurtMob(MT,mk?ri(80,95):ri(60,75),crit());if(mk)claws(MT,'#cfd6ff',4);else burst(wpos2(MT),'#fff',5);
      if(!P.cc&&Math.random()<.1){P.cc=true;callout(P,'Clearcasting','#bfe6ff');ring(P.pos,'#bfe6ff',.4,2.2,.4);}});}
  if(P.anim){P.anim.t+=dt;if(P.anim.t*P.anim.sp>.6)P.anim=null;}
  for(const m of[...mobs])mobAI(m,dt);
  P.mp=P.form==='cat'?P.energy:P.mana;P.mpMax=P.form==='cat'?100:P_MP;
}

  bar.style.background=cat?'linear-gradient(#ffe94a,#c9a81a)':'linear-gradient(#5aa8ff,#1f5fd0)';
  const bk=P.bark>0?0x2a1806:0;
  if(cat){
    P.stA=damp(P.stA,P.prowl?1:0,8,dt);

    if(A){const s=Math.min(1,A.t*A.sp/.6),k=Math.sin(s*Math.PI);
      if(A.type==='swipe'){c.legs[0].rotation.x=-1.8*k;bx=-.15*k;}
      else if(A.type==='both'){c.legs[0].rotation.x=c.legs[1].rotation.x=-1.8*k;bx=-.3*k;by+=.3*k;}
      else if(A.type==='bite'){hx=.5*k;bx=.25*k;c.head.position.z=1.05+.35*k;c.legs[0].rotation.x=-1*k;}
      else if(A.type==='roar'){hx=-.6*k;bx=-.25*k;}}
    else c.head.position.z=damp(c.head.position.z,1.05,10,dt);
    c.body.position.y=damp(c.body.position.y,by,P.leap?40:14,dt);c.body.rotation.x=damp(c.body.rotation.x,bx,18,dt);c.head.rotation.x=damp(c.head.rotation.x,hx,18,dt);
    c.tail.rotation.y=Math.sin(t*3)*.35;c.tail.rotation.x=P.prowl?.4:-.1+Math.sin(t*2)*.1;c.t2.rotation.x=Math.sin(t*2.6)*.3;
    c.tf.material.opacity=P.tf>0?.12+.08*Math.sin(t*14):0;
    if(P.tf>0&&Math.random()<dt*18)part(V(P.pos.x+rand(-.6,.6),GY+rand(.6,1.8),P.pos.z+rand(-.8,.8)),V(0,1.6,0),pick(['#ff7c0a','#ffd23f']),.08,.4,0,'g');
    const op=1-P.stA*.65;for(const x of c.mats){x.opacity=op;x.depthWrite=op>.95;x.emissive.setHex(P.flash>0?0x441111:P.stA>.5?0x1a1030:0);}
    if(P.prowl&&Math.random()<dt*6)part(V(P.pos.x+rand(-.4,.4),GY+rand(.3,1.4),P.pos.z+rand(-.6,.6)),V(0,.4,0),'#8a7aaa',.08,.6,0,'b');
    if(P.moving&&!P.prowl&&Math.random()<dt*10)part(V(P.pos.x,GY+.15,P.pos.z),V(rand(-.5,.5),.5,rand(-.5,.5)),'#a8c070',.15,.4,0,'b');
    if(P.dash>0&&P.moving&&Math.random()<dt*40)part(V(P.pos.x+rand(-.4,.4),GY+rand(.4,1.4),P.pos.z+rand(-.4,.4)),V(-Math.sin(P.face)*4,0,-Math.cos(P.face)*4),pick(['#ffd23f','#ffe9a0']),V(.06,.06,.5),.3,0,'g');
  }else if(mk){
    legs(k.legs,P.walk,P.moving?.6:0);
    let by=P.moving?Math.abs(Math.sin(P.walk))*.12:Math.sin(t*1.6)*.03,bx=0,ar,al,az=0;const A=P.anim;
    if(A&&A.type==='swipe'){const s=Math.min(1,A.t*A.sp/.6);ar=s<.4?lerp(-.4,-2.5,s/.4):lerp(-2.5,-.3,(s-.4)/.6);al=-.4;bx=s<.4?-.1:.18;}
    else if(P.chan){ar=al=-2.9+Math.sin(t*6)*.12;az=.35;by+=.1;}
    else if(P.cast){ar=al=-1.5+Math.sin(t*9)*.1;az=.25;bx=-.06;}
    else if(P.combat){ar=al=-.5;}
    else{ar=P.moving?Math.sin(P.walk)*.4:0;al=-ar;}
    k.armR.rotation.x=damp(k.armR.rotation.x,ar,14,dt);k.armL.rotation.x=damp(k.armL.rotation.x,al,14,dt);
    k.armR.rotation.z=damp(k.armR.rotation.z,-az,10,dt);k.armL.rotation.z=damp(k.armL.rotation.z,az,10,dt);
    k.body.position.y=damp(k.body.position.y,by,14,dt);k.body.rotation.x=damp(k.body.rotation.x,bx,14,dt);k.head.rotation.z=Math.sin(t*1.3)*.05;
    k.aura.material.opacity=.16+.06*Math.sin(t*3);k.aura.rotation.y+=dt*.6;
    if(Math.random()<dt*5){const a=rand(0,6.3);part(V(P.pos.x+Math.cos(a)*2.3,GY+.1,P.pos.z+Math.sin(a)*2.3),V(0,.9,0),'#6a7ad0',.07,.9,0,'g');}
    for(const x of k.mats)x.emissive.setHex(P.flash>0?0x441111:bk);
  }else{
    const sit=P.drink>0;
    if(sit)for(const l of m.legs)l.rotation.x=damp(l.rotation.x,-1.45,10,dt);else legs(m.legs,P.walk,P.moving?.7:0);
    m.body.position.y=damp(m.body.position.y,sit?-.66:P.moving?Math.abs(Math.sin(P.walk))*.08:Math.sin(t*1.8)*.02,14,dt);
    let ar,al;const A=P.anim;
    if(sit){ar=-.6;al=-1.3;}
    else if(A&&A.type==='staff'){const s=Math.min(1,A.t*A.sp/.6);ar=s<.4?lerp(-.6,-2.6,s/.4):lerp(-2.6,-.4,(s-.4)/.6);al=-.5;}
    else if(P.cast&&P.cast.id==='spec'){ar=-2.2;al=-2.9;}
    else if(P.cast){ar=-.3;al=-2.5;}
    else if(P.combat){ar=-.7;al=-.6;}
    else{ar=P.moving?Math.sin(P.walk)*.4-.3:-.3;al=P.moving?-Math.sin(P.walk)*.4:0;}
    m.armR.rotation.x=damp(m.armR.rotation.x,ar,14,dt);m.armL.rotation.x=damp(m.armL.rotation.x,al,12,dt);m.staff.rotation.x=damp(m.staff.rotation.x,sit?1.2:.35,10,dt);
    m.cup.visible=sit;if(sit&&Math.random()<dt*8)part(V(P.pos.x+rand(-.6,.6),GY+rand(.2,1.2),P.pos.z+rand(-.6,.6)),V(0,1.2,0),'#8fd0ff',.1,.8,0,'g');
    m.gem.scale.setScalar(.22*(1+Math.sin(t*4)*.15));
    for(const x of m.mats)x.emissive.setHex(P.flash>0?0x441111:bk);
  }
  barkG.visible=P.bark>0;if(barkG.visible){const r=mk?1.05:cat?.72:.8;barkG.position.set(P.pos.x,GY+(cat&&P.prowl?-.3:0),P.pos.z);barkG.rotation.y+=dt*.25;
    const pop=Math.min(1,(12-P.bark)/.25,P.bark/.3);barkG.scale.set(r*pop,mk?1.15:cat?.65:1,r*pop);}
  if(P.chan){const C=P.chan;for(let i=0,n=Math.ceil(dt*170);i<n;i++){const a=rand(0,6.3),r=rand(.5,4.7),y=rand(.2,5.5);
    part(V(C.at.x+Math.cos(a)*r,GY+y,C.at.z+Math.sin(a)*r),V(-Math.sin(a)*8-Math.cos(a),rand(.5,2),Math.cos(a)*8-Math.sin(a)),
      Math.random()<.25?pick(['#5a8a2a','#8a6a3a','#7aa832']):pick(['#9ab8d0','#bfd4e0','#7a9ab0']),rand(.06,.13),.45,0,Math.random()<.25?'b':'g');}}
  if(P.cc&&Math.random()<dt*24){const a=t*5+rand(-.4,.4),r=cat?.8:mk?1.2:.9;part(V(P.pos.x+Math.cos(a)*r,GY+rand(.3,cat?1.4:2.6),P.pos.z+Math.sin(a)*r),V(-Math.sin(a)*1.5,.6,Math.cos(a)*1.5),pick(['#9ab8e0','#ffffff']),.07,.45,0,'g');}
  if(P.inn>0&&Math.random()<dt*20){const a=t*4+rand(0,6.3);part(V(P.pos.x+Math.cos(a)*1.1,GY+rand(.2,1),P.pos.z+Math.sin(a)*1.1),V(0,2.2,0),pick(['#5a8ad0','#9ab8e0']),.08,.9,0,'g');}
  if(P.thorns>0&&Math.random()<dt*3){const a=rand(0,6.3);part(V(P.pos.x+Math.cos(a)*.9,GY+rand(.4,1.8),P.pos.z+Math.sin(a)*.9),V(0,.3,0),'#7ad84a',.06,.6,0,'g');}
  if(P.motw>0&&Math.random()<dt*2)part(V(P.pos.x+rand(-.6,.6),GY+rand(.4,2.4),P.pos.z+rand(-.6,.6)),V(0,.8,0),'#e27aff',.05,.7,0,'g');
  if(P.rejuv>0&&Math.random()<dt*8)part(V(P.pos.x+rand(-.6,.6),GY+rand(.2,2),P.pos.z+rand(-.6,.6)),V(0,1,0),'#9bff9a',.06,.6,0,'g');
}
function animate(dt,t){
  animP(dt,t);for(const m of mobs){animMob(m,dt,t);if(m.ffd>0&&Math.random()<dt*6)part(V(m.pos.x+rand(-.6,.6),GY+rand(.5,2),m.pos.z+rand(-.6,.6)),V(0,.5,0),'#e27aff',.07,.6,0,'g');}
  showCP(P.target,P.form==='cat'?P.cp:0,t);
  waves(t);grassTick(t);
  for(const b of birds){const a=t*b.sp+b.ph;b.g.position.set(Math.cos(a)*b.r,b.h+Math.sin(t+b.ph),Math.sin(a)*b.r);b.g.rotation.y=-a;const f=Math.sin(t*3+b.ph)*.3;b.w1.rotation.z=f;b.w2.rotation.z=-f;}
  for(const c of clouds){c.g.position.x+=c.v*dt;if(c.g.position.x>120)c.g.position.x=-120;}
}
function camFocus(){const tgt=V(P.pos.x,1,P.pos.z);const T=P.target&&!P.target.dead?P.target:alive()[0];if(T)tgt.lerp(V(T.pos.x,1,T.pos.z),P.combat?.4:.2);return tgt;}



/* ---------- loop */
let last=performance.now(),acc=0,time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  acc+=dt;while(acc>=1/60){tick(1/60);acc-=1/60;}time+=dt;
  animate(dt,time);updateParts(dt);updFx(dt);updShots(dt);updCallouts(dt);updNums(dt);updFlash(dt);updCastBar();updFrame();
  const tgt=camFocus();const nt=controls.target.clone().lerp(tgt,Math.min(1,dt*2));camera.position.add(nt.clone().sub(controls.target));controls.target.copy(nt);
  controls.update();
  shake=Math.max(0,shake-dt*.9);const o=V(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(shake*.6);
  camera.position.add(o);composer.render();camera.position.sub(o);}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

</script>
